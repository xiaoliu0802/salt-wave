                <button class="home-search-fab" onclick="App.navigate('search')" title="搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
            </div>
        `;
        this.refreshServiceBadge();
    },

    // 刷新首页：重新拉数据并换一首精选推荐
    refreshHome() {
        this.homeSeed = (this.homeSeed || 0) + 1;
        if (typeof showToast === 'function') showToast('已更新精选推荐');
        this.renderHome();
    },

    // 播放当前精选推荐的歌曲，后面接随机队列
    playFeatured() {
        const song = this.featuredSong;
        if (!song) {
            this.playRandom();
            return;
        }
        const norm = (s) => ({
            id: s.id, title: s.title, artist: s.artist, album: s.album,
            coverArt: s.coverArt, duration: s.duration, albumId: s.albumId
        });
        const queue = [norm(song)];
        (this.homeRandoms || []).forEach((s) => {
            if (s && s.id !== song.id && queue.length < 30) queue.push(norm(s));
        });
        Player.playQueue(queue, 0);
    },

    // 首页 WiFi 图标的在线状态（绿=在线，灰=离线）
    async refreshServiceBadge() {
        try {
            await SubsonicAPI.ping();
            this.serviceOnline = true;
        } catch (e) {
            this.serviceOnline = false;
        }
        const btn = document.querySelector('.home-cast-btn');
        if (btn) btn.classList.toggle('offline', this.serviceOnline === false);
    },

    // 音乐库（Navidrome）服务状态弹窗
    showServiceStatus() {
        if (document.getElementById('svc-overlay')) return;
        const serverName = SubsonicAPI.username || 'Navidrome';
        const addr = SubsonicAPI.serverUrl || '';
        const ov = document.createElement('div');
        ov.className = 'svc-overlay';
        ov.id = 'svc-overlay';
        ov.innerHTML = `
            <div class="svc-card">
                <div class="svc-title">Navidrome 服务状态</div>
                <div class="svc-row">名称: <b>${escapeHtml(serverName)}</b></div>
                <div class="svc-row">地址: <b>${escapeHtml(addr)}</b></div>
                <div class="svc-row">用户: <b>${escapeHtml(serverName)}</b></div>
                <div class="svc-row">状态: <span id="svc-status" class="svc-on">在线</span></div>
                <button class="svc-btn" onclick="App.closeServiceStatus()">确定</button>
            </div>`;
        ov.addEventListener('click', (ev) => {
            if (ev.target === ov) App.closeServiceStatus();
        });
        document.body.appendChild(ov);

        // 异步探测一次，避免弹窗里的状态是假的
        SubsonicAPI.ping().then(() => {
            const el = document.getElementById('svc-status');
            if (el) { el.className = 'svc-on'; el.textContent = '在线'; }
            App.serviceOnline = true;
        }).catch((e) => {
            const el = document.getElementById('svc-status');
            if (el) { el.className = 'svc-off'; el.textContent = '离线 · ' + (e.message || '无法连接'); }
            App.serviceOnline = false;
        });
    },

    closeServiceStatus() {
        const ov = document.getElementById('svc-overlay');
        if (ov) ov.remove();
    },

    async renderStarred() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const songs = (this.starredSongs && this.starredSongs.length)
                ? this.starredSongs
                : await SubsonicAPI.getStarred2();
            this.starredSongs = songs;
            content.innerHTML = `<h1 class="page-title">我的最爱<span style="font-size:13px;font-weight:400;color:var(--text-dim);margin-left:8px;">共 ${songs.length} 首</span></h1>`
                + this.songListHTML(songs, 'starred');
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async renderGenres() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const genres = await SubsonicAPI.getGenres();
            if (!genres.length) {
                content.innerHTML = `<h1 class="page-title">流派</h1>${this.emptyState('暂无流派')}`;
                return;
            }
            const cardsHtml = genres.map(g => `
                <button class="lib-card" data-genre="${escapeHtml(g.value)}" onclick="App.playGenre(this.dataset.genre)">
                    <div class="lib-meta">
                        <span class="lib-name">${escapeHtml(g.value)}</span>
                        <span class="lib-count">${Number(g.songCount) || 0} 首</span>
                    </div>
                </button>`).join('');
            content.innerHTML = `<h1 class="page-title">流派</h1><div class="home-grid">${cardsHtml}</div>`;
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async playRandom() {
        try {
            const songs = await SubsonicAPI.getRandomSongs(20);
            if (!songs.length) { showToast('曲库为空'); return; }
            Player.playQueue(songs, 0);
            showToast('随手听听：随机 20 首');
        } catch (e) {
            showToast('播放失败：' + e.message);
        }
    },

    playStarred(index) {
        const songs = this.starredSongs || [];
        if (!songs[index]) return;
        Player.playQueue(songs, index);
    },

    async playGenre(genre) {
        try {
            const songs = await SubsonicAPI.getSongsByGenre(genre, 100);
            if (!songs.length) { showToast('该流派暂无歌曲'); return; }
            Player.playQueue(songs, 0);
            showToast(`播放流派：${genre}`);
        } catch (e) {
            showToast('播放失败：' + e.message);
        }
    },

    async renderAlbums() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const albums = await SubsonicAPI.getAlbumList('newest', 100);
            this.cache.albums = albums;
            content.innerHTML = `<h1 class="page-title">专辑</h1><div class="album-grid">${albums.map(a => this.albumCardHTML(a)).join('')}</div>`;
            if (albums.length === 0) content.innerHTML = `<h1 class="page-title">专辑</h1>${this.emptyState('暂无专辑')}`;
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async renderArtists() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const artists = await SubsonicAPI.getArtists();
            this.cache.artists = artists;
            content.innerHTML = `<h1 class="page-title">艺术家</h1><div class="artist-grid">${artists.map(a => this.artistCardHTML(a)).join('')}</div>`;
            if (artists.length === 0) content.innerHTML = `<h1 class="page-title">艺术家</h1>${this.emptyState('暂无艺术家')}`;
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async renderSongs() {
        const content = document.getElementById('page-content');
        const cacheKey = `saltwave_all_songs_${SubsonicAPI.serverUrl}_${SubsonicAPI.username}`;
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) { cached = null; }
        const cacheFresh = cached && Array.isArray(cached.songs) && (Date.now() - (cached.ts || 0) < 10 * 60 * 1000);

        const paint = (songs, note) => {
            content.innerHTML = `<h1 class="page-title">歌曲<span style="font-size:13px;font-weight:400;color:var(--text-dim);margin-left:8px;">共 ${songs.length} 首</span></h1>`
                + (note ? `<div id="songs-progress" style="font-size:13px;color:var(--text-dim);margin:-4px 0 12px;">${note}</div>` : '')
                + this.songListHTML(songs, 'songs');
        };

        if (cached && Array.isArray(cached.songs) && cached.songs.length) {
            this.cache.songs = cached.songs;
            paint(cached.songs, cacheFresh ? '' : '正在刷新曲库…');
            if (cacheFresh) return;
        } else {
            content.innerHTML = '<div class="loading"><div class="spinner"></div><div id="songs-progress" style="margin-top:12px;color:var(--text-dim);font-size:13px;">正在扫描曲库…</div></div>';
        }

        try {
            const songs = await SubsonicAPI.getAllSongs((done, total) => {
                const el = document.getElementById('songs-progress');
                if (el) el.textContent = `正在扫描专辑 ${done}/${total}…`;
            });
            songs.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN'));
            this.cache.songs = songs;
            try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), songs })); } catch (e) {}
            paint(songs, '');
        } catch (e) {
            if (!cached) content.innerHTML = this.emptyState('加载失败：' + e.message);
            else {
                const el = document.getElementById('songs-progress');
                if (el) el.textContent = '刷新失败：' + e.message;
            }
        }
    },

    async renderPlaylists() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const playlists = await SubsonicAPI.getPlaylists();
            this.cache.playlists = playlists;

            const chevron = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>`;
            const plIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`;

            content.innerHTML = `
                <div class="pl-page">
                    <div class="pl-top">
                        <button class="pl-back" onclick="App.navBack()" title="返回">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 6 9 12 15 18"/></svg>
                        </button>
                        <button class="pl-new" onclick="App.openPlaylistModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            新建歌单
                        </button>
                    </div>
                    <h1 class="pl-title">播放列表</h1>
                    <div class="pl-sub">共 ${playlists.length} 个歌单</div>
                    <div class="pl-list" id="pl-list"></div>
                </div>
            `;

            const list = document.getElementById('pl-list');
            if (playlists.length === 0) {
                list.innerHTML = this.emptyState('暂无歌单，点右上角新建');
                return;
            }

            list.innerHTML = playlists.map((p, i) => `
                <button class="pl-row" onclick="App.openPlaylist('${p.id}')">
                    <div class="pl-cover" id="pl-cover-${i}">
                        <div class="pl-layer l1"></div>
                        <div class="pl-layer l2"></div>
                        <div class="pl-layer"><div class="pl-icon-wrap">${plIcon}</div></div>
                    </div>
                    <div class="pl-info">
                        <div class="pl-name">${escapeHtml(p.name || '未命名歌单')}</div>
                        <div class="pl-meta" id="pl-meta-${i}">${p.songCount || 0} 歌曲</div>
                    </div>
                    <div class="pl-chev">${chevron}</div>
                </button>
            `).join('');

            // 逐个补齐封面拼贴与总时长（只取前 12 个，避免歌单很多时请求过多）
            playlists.slice(0, 12).forEach((p, i) => this.loadPlaylistMeta(p.id, i));
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async loadPlaylistMeta(id, index) {
        try {
            const detail = await SubsonicAPI.getPlaylist(id);
            const songs = detail.entry || [];
            const total = songs.reduce((n, s) => n + (Number(s.duration) || 0), 0);
            const meta = document.getElementById('pl-meta-' + index);
            if (meta) meta.textContent = `${songs.length} 歌曲，${this.formatDuration(total)}`;

            const covers = [];
            songs.forEach((s) => {
                const c = s.coverArt;
                if (c && covers.indexOf(c) === -1 && covers.length < 4) covers.push(c);
            });
            const coverEl = document.getElementById('pl-cover-' + index);
            if (coverEl && covers.length) {
                coverEl.innerHTML = `
                    <div class="pl-layer l1"></div>
                    <div class="pl-layer l2"></div>
                    <div class="pl-layer pl-collage">${covers.map(c => `<img src="${SubsonicAPI.getCoverArtUrl(c, 200)}" alt="">`).join('')}</div>
                `;
            }
        } catch (e) { /* 单个歌单取不到不影响列表 */ }
    },

    formatDuration(sec) {
        const total = Math.max(0, Math.round(Number(sec) || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        if (h > 0) return `${h}小时 ${m}分钟 ${s}秒`;
        if (m > 0) return `${m}分钟 ${s}秒`;
        return `${s}秒`;
    },

    // 从播放页等非列表场景进入详情：只切壳，不触发列表重新加载
    enterDetailView(parent) {
        this.currentView = parent || 'albums';
        this.navStack = this.navStack || [];
        if (this.navStack[this.navStack.length - 1] !== this.currentView) {
            this.navStack.push(this.currentView);
            if (this.navStack.length > 30) this.navStack.shift();
        }
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.view === this.currentView);
        });
        const app = document.getElementById('app');
        app.classList.remove('home-mode', 'settings-mode', 'playlists-mode');
        this.applyTheme();
    },

    async openAlbum(id) {
        this.detailParent = 'albums';
        this.enterDetailView('albums');
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const album = await SubsonicAPI.getAlbum(id);
            const songs = album.song || [];
            content.innerHTML = `
                <div style="margin-bottom:16px;">
                    <button class="ctrl-btn" onclick="App.navigate('albums')" style="font-size:14px;display:inline-flex;align-items:center;gap:4px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        返回
                    </button>
                </div>
                <div class="album-detail-header">
                    <div class="album-detail-cover">
                        ${album.coverArt ? `<img src="${SubsonicAPI.getCoverArtUrl(album.coverArt, 400)}" alt="" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="album-detail-info">
                        <div class="album-detail-type">专辑</div>
                        <div class="album-detail-name">${escapeHtml(album.name || '未知专辑')}</div>
                        <div class="album-detail-meta">${escapeHtml(album.artist || '')}${album.year ? ' · ' + album.year : ''} · ${songs.length} 首</div>
                        <button class="album-play-all" onclick="Player.playQueue(${JSON.stringify(songs.map(s => ({id:s.id,title:s.title,artist:s.artist,album:s.album,coverArt:s.coverArt,duration:s.duration}))).replace(/"/g,'&quot;')})">
                            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            播放全部
                        </button>
                    </div>
                </div>
                ${this.songListHTML(songs)}
            `;
        } catch (e) {
            content.innerHTML = this.emptyState('加载失败：' + e.message);
        }
    },

    async openPlaylist(id) {
        this.detailParent = 'playlists';
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
        try {
            const playlist = await SubsonicAPI.getPlaylist(id);
            const songs = playlist.entry || [];
            const total = songs.reduce((n, s) => n + (Number(s.duration) || 0), 0);
            const name = playlist.name || '歌单';
            content.innerHTML = `
                <div class="pl-page">
                    <div class="pl-top">
                        <button class="pl-back" onclick="App.navigate('playlists')" title="返回">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 6 9 12 15 18"/></svg>
                        </button>
                        <button class="pl-danger" onclick="App.deletePlaylist('${playlist.id}','${escapeHtml(name).replace(/'/g,"&#39;")}')">删除歌单</button>
                    </div>
                    <h1 class="pl-title">${escapeHtml(name)}</h1>
                    <div class="pl-sub">${songs.length} 歌曲，${this.formatDuration(total)}</div>
                    ${songs.length > 0 ? `<button class="album-play-all" onclick="Player.playQueue(${JSON.stringify(songs.map(s => ({id:s.id,title:s.title,artist:s.artist,album:s.album,coverArt:s.coverArt,duration:s.duration}))).replace(/"/g,'&quot;')})" style="margin:4px 0 18px;">
                        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        播放全部
                    </button>` : ''}

            `;

        }

    handleSearch(event) {
        const query = event.target.value.trim();
        if (this.searchTimer) clearTimeout(this.searchTimer);
        if (!query) return;
        this.searchTimer = setTimeout(() => this.doSearch(query), 400);
    },

    async doSearch(query) {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>搜索中...</div>';
        try {
            const result = await SubsonicAPI.search(query);
            const artists = result.artist || [];
            const albums = result.album || [];
            const songs = result.song || [];

            if (artists.length === 0 && albums.length === 0 && songs.length === 0) {
                content.innerHTML = `<h1 class="page-title">搜索：${escapeHtml(query)}</h1>${this.emptyState('没有找到结果')}`;
                return;
            }

            let html = `<h1 class="page-title">搜索：${escapeHtml(query)}</h1>`;
            if (songs.length > 0) {
                html += `<h2 class="section-title">歌曲</h2>${this.songListHTML(songs)}`;
            }
            if (albums.length > 0) {
                html += `<h2 class="section-title" style="margin-top:24px;">专辑</h2><div class="album-grid">${albums.map(a => this.albumCardHTML(a)).join('')}</div>`;
            }
            if (artists.length > 0) {
                html += `<h2 class="section-title" style="margin-top:24px;">艺术家</h2><div class="artist-grid">${artists.map(a => this.artistCardHTML(a)).join('')}</div>`;
            }
            content.innerHTML = html;
        } catch (e) {
            content.innerHTML = this.emptyState('搜索失败：' + e.message);
        }
    },

    focusSearch() {
        document.getElementById('search-input').focus();
        if (!document.getElementById('page-content').querySelector('.empty-state')) {
            document.getElementById('page-content').innerHTML = `<h1 class="page-title">搜索</h1>${this.emptyState('在上方搜索框输入关键词')}`;
        }
    },

    // 按艺术家名搜索（播放页"艺术家"入口）
    searchArtist(name) {
        if (!name) return;
        this.navigate('search');
        const input = document.getElementById('search-input');
        if (input) {
            input.value = name;
            input.dispatchEvent(new Event('input'));
        }
    },

    // 把当前歌曲加进某个已有歌单
    async addSongToPlaylist(song) {
        if (!song || !song.id) return;
        let lists = [];
        try {
            lists = await SubsonicAPI.getPlaylists();
        } catch (e) {
            showToast('读取歌单失败：' + e.message);
            return;
        }
        if (!lists.length) {
            showToast('还没有歌单，先到「播放列表」新建一个');
            return;
        }
        const opts = lists.map((p) => ({ value: p.id, label: p.name }));
        this.openPicker('添加到歌单', opts, null, async (pid) => {
            const picked = lists.find((p) => String(p.id) === String(pid));
            try {
                await SubsonicAPI.addToPlaylist(pid, song.id);
                showToast(`已添加到「${picked ? picked.name : '歌单'}」`);
            } catch (e) {
                showToast('添加失败：' + e.message);
            }
        });
    },

    openPlaylistModal() {
        document.getElementById('playlist-modal').classList.add('active');
        document.getElementById('playlist-name-input').focus();
    },

    closePlaylistModal() {
        document.getElementById('playlist-modal').classList.remove('active');
        document.getElementById('playlist-name-input').value = '';
    },

    async createPlaylist() {
        const name = document.getElementById('playlist-name-input').value.trim();
        if (!name) return;
        try {
            await SubsonicAPI.createPlaylist(name);
            this.closePlaylistModal();
            showToast('歌单已创建');
            this.renderPlaylists();
        } catch (e) {
            showToast('创建失败：' + e.message);
        }
    },

        if (!confirm(`确定删除歌单"${name}"？`)) return;
        try {
            await SubsonicAPI.deletePlaylist(id);
            showToast('歌单已删除');
            this.renderPlaylists();

            showToast('删除失败：' + e.message);

                    ${a.coverArt ? `<img src="${SubsonicAPI.getCoverArtUrl(a.coverArt, 300)}" alt="" onerror="this.style.display='none'">` : ''}

    songListHTML(songs, listId) {
        if (!songs || songs.length === 0) return this.emptyState('暂无歌曲');
        this.songLists = this.songLists || {};
        const key = listId || ('list_' + (++this._listSeq));
        this.songLists[key] = songs;
        const header = `<div class="song-list-header"><div>#</div><div style="grid-column:2 / 4;">歌曲</div><div style="text-align:right;">时长</div><div></div></div>`;
        const items = songs.map((s, i) => {
            const artId = s.coverArt || s.id;
            const sub = [s.artist, s.album].filter(Boolean).join(' · ');
            return `
            <div class="song-item" data-song-id="${s.id}" onclick="App.playList('${key}', ${i})">
                <div class="song-index">${i + 1}</div>
                <div class="song-cover">
                    ${artId
                        ? `<img src="${SubsonicAPI.getCoverArtUrl(artId, 120)}" alt="" loading="lazy" onerror="this.style.display='none'">`
                        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>`}

                <div class="song-info">
                    <div class="song-title">${escapeHtml(s.title || '未知')}</div>
                    <div class="song-artist">${escapeHtml(sub)}</div>

                <div class="song-actions">
                    <button class="song-action-btn" onclick="event.stopPropagation();App.addToQueueFrom('${key}', ${i})" title="加入队列">

                </div>

        }).join('');
        return header + items;
    },

    playList(key, index) {
        const songs = (this.songLists || {})[key];
        if (!songs || !songs[index]) return;
        Player.playQueue(songs, index);
        this.highlightPlayingSong();
    },

    addToQueueFrom(key, index) {
        const songs = (this.songLists || {})[key];
        if (!songs || !songs[index]) return;
        const song = songs[index];
        Player.addToQueue({
            id: song.id,
            title: song.title,
            artist: song.artist,
            album: song.album,
            coverArt: song.coverArt,
            duration: song.duration
        });
    },

    emptyState(text) {
        return `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <h3>${escapeHtml(text)}</h3>
            </div>
        `;
    }
};

// ===== APK / 移动端环境适配 =====
const AppEnv = {
    isAndroidApp: /SaltWave/i.test(navigator.userAgent) || !!window.AndroidBridge,

    init() {
        // Android 返回键：优先关闭歌词面板 / 弹窗，其次返回上一个视图
        document.addEventListener('backbutton', () => this.handleBack(), false);

        // 兼容自定义原生桥
        if (window.AndroidBridge && window.AndroidBridge.setOnBackCallback) {
            window.AndroidBridge.setOnBackCallback('AppEnv.handleBack');
        }

        // 左边缘右滑 = 返回上一层（弹层 → 歌词页 → 视图栈），到底不动，不退出 App
        this.initEdgeSwipeBack();

        // 网络状态提示
        window.addEventListener('offline', () => showToast('网络已断开'));
        window.addEventListener('online', () => showToast('网络已恢复'));

        // 阻止 iOS/Android 双击缩放与下拉回弹
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        // 平板 / 车机布局（宽屏横屏自动切换）
        App.applyTabletMode();
    },

    // 左边缘右滑返回：逐层收起（播放列表/歌词设置/歌词页/侧边栏/上一个视图）
    initEdgeSwipeBack() {
        const EDGE = 28;     // 触起点必须贴左边
        const MIN_DX = 64;   // 横向位移阈值
        let startX = 0, startY = 0, tracking = false;

        document.addEventListener('touchstart', (e) => {
            tracking = false;
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            const target = e.target;
            // 滑块、进度条属于横向拖拽控件，不参与返回手势
            if (target && target.closest && target.closest('input, .lc-track, .ls-range')) return;
            startX = t.clientX;
            startY = t.clientY;
            tracking = startX <= EDGE;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!tracking) return;
            const t = e.touches[0];
            const dx = t.clientX - startX;
            const dy = Math.abs(t.clientY - startY);
            if (dy > 36) { tracking = false; return; }   // 更接近纵向滚动
            if (dx >= MIN_DX) {
                tracking = false;
                this.handleBack();                        // 只退一层；退无可退时保持不动
            }
        }, { passive: true });

        document.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
    },

    handleBack() {
        // 0. 歌曲信息 / 歌曲操作面板（最上层）
        if (document.getElementById('si-overlay')) {
            document.getElementById('si-overlay').remove();
            return true;
        }
        if (document.getElementById('ss-overlay')) {
            Player.closeSongActions();
            return true;
        }
        // 0. 选项弹窗（最上层）
        if (document.getElementById('pick-overlay')) {
            App.closePicker();
            return true;
        }
        // 0. 播放列表弹层（最上层）
        if (QueuePanel.isOpen()) {
            QueuePanel.close();
            return true;
        }
        // 1. 歌词参数二级面板（最上层）
        if (LyricsStyle.isAdvancedOpen()) {
            LyricsStyle.closeAdvanced();
            return true;
        }
        // 1. 歌词设置面板
        const settingsOverlay = document.getElementById('lyrics-settings-overlay');
        if (settingsOverlay && settingsOverlay.classList.contains('open')) {
            LyricsStyle.closeSettings();
            return true;
        }
        // 1. 歌词面板
        const lyricsOverlay = document.getElementById('lyrics-overlay');
        if (lyricsOverlay && lyricsOverlay.classList.contains('active')) {
            Player.closeLyricsPanel();
            return true;
        }
        // 2. 歌单弹窗
        const modal = document.getElementById('playlist-modal');
        if (modal && modal.classList.contains('active')) {
            App.closePlaylistModal();
            return true;
        }
        // 3. 详情页（歌单/专辑详情）：先退回列表页
        if (App.detailParent) {
            const parent = App.detailParent;
            App.detailParent = null;
            App.navigate(parent);
            return true;
        }
        // 4. 返回上一个视图
        const stack = App.navStack || [];
        if (stack.length > 1) {
            stack.pop();
            const prev = stack.pop() || 'home';
            App.navigate(prev);
            return true;
        }
        // 5. 已经在首页：第一次按只提示，2 秒内连按两次才交给原生退出
        const now = Date.now();
        if (this._lastRootBackAt && now - this._lastRootBackAt < 2000) {
            this._lastRootBackAt = 0;
            return false;
        }
        this._lastRootBackAt = now;
        showToast('再按一次返回键退出');
        return true;
    }
};

// 顶层 const 不会成为 window 的属性，必须显式导出，否则原生 evaluateJavascript 取不到
window.App = App;
window.Player = Player;

window.SaltWaveBack = function () {
    try {
        return AppEnv.handleBack() ? 'handled' : 'exit';
    } catch (e) {
        return 'handled';   // 出错也不要退出 App
    }
};

// ===== 工具函数 =====
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// 复制文本：优先剪贴板 API，WebView 里回退到 textarea
function copyText(text) {
    return new Promise((resolve, reject) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(resolve).catch(() => fallback());
        } else {
            fallback();
        }
        function fallback() {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand && document.execCommand('copy');
                document.body.removeChild(ta);
                ok ? resolve() : reject(new Error('copy unsupported'));
            } catch (e) { reject(e); }
        }
    });
}

function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== 启动错误可见化（真机白屏/异常时不再静默）=====
function showFatal(tag, err) {
    try {
        const old = document.getElementById('fatal-banner');
        if (old) old.remove();
        const box = document.createElement('div');
        box.id = 'fatal-banner';
        box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;' +
            'font:12px/1.5 monospace;padding:12px 14px;max-height:45%;overflow:auto;white-space:pre-wrap;';
        const msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
        box.textContent = '[启动错误] ' + tag + '\n' + msg;
        document.body.appendChild(box);
    } catch (e) { /* 连错误条都画不出来时无计可施 */ }
}

window.addEventListener('error', (e) => {
    if (e && (e.message || e.error)) showFatal('window.onerror', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e) => {
    showFatal('unhandledrejection', e && e.reason ? e.reason : 'unknown');
});

document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); App.login(); });
document.getElementById('playlist-name-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') App.createPlaylist();
    if (e.key === 'Escape') App.closePlaylistModal();
});

try {
    var ua = navigator.userAgent || '';
    var cm = ua.match(/Chrome\/([\d.]+)/);
    var foot = document.getElementById('login-foot');
    if (foot) foot.textContent = 'v1.0.15 · ' + (cm ? 'WebView ' + cm[1] : ua.slice(0, 48));
} catch (e) { console.error(e); }
try { Player.init(); } catch (e) { console.error(e); showFatal('Player.init', e); }
try { AppEnv.init(); } catch (e) { console.error(e); showFatal('AppEnv.init', e); }
try { App.watchSystemTheme(); } catch (e) { console.error(e); }
try { App.autoLogin(); } catch (e) { console.error(e); showFatal('App.autoLogin', e); }
