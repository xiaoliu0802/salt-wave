<script>
// ========================================
//  Subsonic API 客户端 — 纯前端，无后端代理
// ========================================
const SubsonicAPI = {
    serverUrl: '',
    username: '',
    password: '',
    clientName: 'SaltWave',

    init(serverUrl, username, password) {
        this.serverUrl = serverUrl.replace(/\/+$/, '');
        this.username = username;
        this.password = password;
    },

    _genSalt() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let salt = '';
        for (let i = 0; i < 12; i++) salt += chars[Math.floor(Math.random() * chars.length)];
        return salt;
    },

    _md5(str) {
        return CryptoJS.MD5(str).toString();
    },

    _buildParams(extra = {}) {
        const salt = this._genSalt();
        const token = this._md5(this.password + salt);
        const params = new URLSearchParams();
        params.append('u', this.username);
        params.append('t', token);
        params.append('s', salt);
        params.append('v', '1.16.1');
        params.append('c', this.clientName);
        params.append('f', 'json');
        for (const [key, value] of Object.entries(extra)) {
            params.append(key, value);
        }
        return params.toString();
    },

    async _call(method, params = {}) {
        const url = `${this.serverUrl}/rest/${method}?${this._buildParams(params)}`;
        let res;
        let timerId = null;
        const timeout = new Promise((_, reject) => {
            timerId = setTimeout(() => { const err = new Error('连接超时'); err.__timeout = true; reject(err); }, 15000);
        });
        try {
            res = await Promise.race([fetch(url), timeout]);
        } catch (e) {
            if (e && e.__timeout) throw new Error('连接超时，请检查车机网络或服务器地址');
            throw new Error('无法连接服务器，请检查地址是否正确');
        } finally {
            if (timerId) clearTimeout(timerId);
        }
        if (!res.ok) throw new Error(`服务器返回错误 ${res.status}`);
        const data = await res.json();
        if (data['subsonic-response'].status === 'failed') {
            throw new Error(((data['subsonic-response'].error || {}).message) || 'API错误');
        }
        return data['subsonic-response'];
    },

    async ping() {
        return this._call('ping');
    },

    async getAlbumList(type = 'newest', size = 24, offset = 0) {
        const resp = await this._call('getAlbumList2', { type, size, offset });
        return (resp.albumList2 && resp.albumList2.album) || [];
    },

    // 分页取全部专辑（用于统计与封面拼贴）
    async getAllAlbums() {
        const albums = [];
        const PAGE = 500;
        for (let page = 0; page < 10; page++) {
            const batch = await this.getAlbumList('alphabeticalByArtist', PAGE, page * PAGE);
            albums.push(...batch);
            if (batch.length < PAGE) break;
        }
        return albums;
    },

    async getStarred2() {
        const resp = await this._call('getStarred2', {});
        return (resp.starred2 && resp.starred2.song) || [];
    },

    async getGenres() {
        const resp = await this._call('getGenres', {});
        return (resp.genres && resp.genres.genre) || [];
    },

    async getSongsByGenre(genre, count = 100, offset = 0) {
        const resp = await this._call('getSongsByGenre', { genre, count, offset });
        return (resp.songsByGenre && resp.songsByGenre.song) || [];
    },

    async getArtists() {
        const resp = await this._call('getArtists');
        const artists = [];
        const indexes = (resp.artists && resp.artists.index) || [];
        for (const idx of indexes) {
            for (const artist of (idx.artist || [])) {
                artists.push(artist);
            }
        }
        return artists;
    },

    async getAlbum(id) {
        const resp = await this._call('getAlbum', { id });
        return resp.album;
    },

    async getArtist(id) {
        const resp = await this._call('getArtist', { id });
        return resp.artist;
    },

    async getRandomSongs(size = 50) {
        const resp = await this._call('getRandomSongs', { size });
        return (resp.randomSongs && resp.randomSongs.song) || [];
    },

    // 全库歌曲：Subsonic 没有“列出全部歌曲”的接口，
    // 先用 getAlbumList2 分页取全部专辑，再逐张 getAlbum 取曲目（限并发，逐张回报进度）
    async getAllSongs(onProgress) {
        const albums = [];
        const PAGE = 500;
        for (let page = 0; page < 20; page++) {
            const batch = await this.getAlbumList('alphabeticalByArtist', PAGE, page * PAGE);
            albums.push(...batch);
            if (batch.length < PAGE) break;
        }
        if (albums.length === 0) return [];

        const songs = [];
        const CONCURRENCY = 6;
        let cursor = 0;
        let done = 0;

        const worker = async () => {
            while (cursor < albums.length) {
                const album = albums[cursor++];
                try {
                    const detail = await this.getAlbum(album.id);
                    ((detail && detail.song) || []).forEach((song) => {
                        songs.push({
                            id: song.id,
                            title: song.title,
                            artist: song.artist || album.artist || '',
                            album: song.album || album.name || '',
                            coverArt: song.coverArt || album.coverArt,
                            duration: song.duration,
                            albumId: album.id
                        });
                    });
                } catch (e) {
                    // 单张专辑取不到不影响整库
                }
                done++;
                if (onProgress && done % 5 === 0) onProgress(done, albums.length);
            }
        };

        await Promise.all(Array.from({ length: CONCURRENCY }, worker));
        if (onProgress) onProgress(albums.length, albums.length);
        return songs;
    },

    async search(query) {
        const resp = await this._call('search3', {
            query,
            artistCount: 10,
            albumCount: 20,
            songCount: 30
        });
        return resp.searchResult3 || {};
    },

    async getPlaylists() {
        const resp = await this._call('getPlaylists');
        return (resp.playlists && resp.playlists.playlist) || [];
    },

    async getPlaylist(id) {
        const resp = await this._call('getPlaylist', { id });
        return resp.playlist;
    },

    async createPlaylist(name, songIds = []) {
        const params = { name };
        songIds.forEach((id, i) => params[`songId[${i}]`] = id);
        return this._call('createPlaylist', params);
    },

    async deletePlaylist(id) {
        return this._call('deletePlaylist', { id });
    },

    // 往已有歌单追加一首歌
    async addToPlaylist(playlistId, songId) {
        return this._call('updatePlaylist', { playlistId, songIdToAdd: songId });
    },

    getStreamUrl(id) {
        const salt = this._genSalt();
        const token = this._md5(this.password + salt);
        const params = new URLSearchParams();
        params.append('u', this.username);
        params.append('t', token);
        params.append('s', salt);
        params.append('v', '1.16.1');
        params.append('c', this.clientName);
        params.append('id', id);
        // 按网络类型套用音质档位（Navidrome 支持 format + maxBitRate 转码）
        try {
            const q = Settings.qualityParams();
            if (q) {
                params.append('format', q.format);
                params.append('maxBitRate', String(q.maxBitRate));
            }
        } catch (e) { /* 设置未就绪时按原音质请求 */ }
        return `${this.serverUrl}/rest/stream?${params.toString()}`;
    },

    getCoverArtUrl(id, size = 300) {
        if (!id) return '';
        const salt = this._genSalt();
        const token = this._md5(this.password + salt);
        const params = new URLSearchParams();
        params.append('u', this.username);
        params.append('t', token);
        params.append('s', salt);
        params.append('v', '1.16.1');
        params.append('c', this.clientName);
        params.append('id', id);
        params.append('size', size);
        return `${this.serverUrl}/rest/getCoverArt?${params.toString()}`;
    },

    async getLyrics(songId, artist, title) {
        // First: try OpenSubsonic getLyricsBySongId (returns structured lyrics with timestamps)
        try {
            const resp = await this._call('getLyricsBySongId', { id: songId });
            const lyricsList = resp.lyricsList;
            if (lyricsList && lyricsList.structuredLyrics) {
                const structured = Array.isArray(lyricsList.structuredLyrics) ? lyricsList.structuredLyrics : [lyricsList.structuredLyrics];
                let best = structured.find(s => s.synced) || structured[0];
                if (best && best.line) {
                    const offset = best.offset ? best.offset : 0;
                    const lines = best.line.map(l => {
                        const time = (l.start !== undefined) ? (l.start + offset) / 1000 : -1;
                        return { time, text: l.value || '' };
                    });
                    const synced = best.synced === true;
                    const text = lines.map(l => l.text).join('\n');
                    return { synced, text, lines };
                }
            }
        } catch (e) {
            // getLyricsBySongId not supported, fall through
        }

        // Fallback: legacy getLyrics by artist/title (returns plain text, no timestamps)
        try {
            const resp = await this._call('getLyrics', { artist: artist || '', title: title || '' });
            const text = (resp.lyrics && (resp.lyrics.value || resp.lyrics._)) || '';
            if (text) return { synced: false, text };
        } catch (e) {
            // No lyrics available
        }

        return null;
    }
};

// ========================================
//  应用设置（本地持久化）
// ========================================
const Settings = {
    key: 'saltwave_app_settings',
    state: {
        // 网络与音质
        qualityWifi: '原音质',
        qualityCell: '128 kbps',
        playNetwork: '任意网络',
        dataOnCell: true,
        preloadOnHome: true,
        // 歌词
        lyricsOn: true,
        miniLyric: false,
        lyricDelay: 0,
        sleepMinutes: 0,
        // 播放
        volumeBalance: false,
        crossfade: true,
        gapless: false,
        pauseAfterTrack: false,
        autoPlayOnStart: false,
        mixWithOthers: true,
        // 外观
        theme: 'system',
        tabletMode: 'auto'
    },

    load() {
        try {
            const saved = JSON.parse(localStorage.getItem(this.key) || 'null');
            if (saved && typeof saved === 'object') Object.assign(this.state, saved);
        } catch (e) { /* 忽略损坏配置 */ }
    },

    save() {
        try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {}
    },

    get(k) { return this.state[k]; },

    toggle(k) {
        this.state[k] = !this.state[k];
        this.save();
        document.querySelectorAll('[data-toggle="' + k + '"]').forEach((el) => {
            el.classList.toggle('on', !!this.state[k]);
        });
        if (typeof Player !== 'undefined' && Player.applySettings) Player.applySettings();
    },

    // 音质档位轮换
    QUALITY: ['原音质', '320 kbps', '192 kbps', '128 kbps'],

    cycleQuality(k) {
        const idx = this.QUALITY.indexOf(this.state[k]);
        this.state[k] = this.QUALITY[(idx + 1) % this.QUALITY.length];
        this.save();
        App.renderSettings();
    },

    cycleNetwork() {
        this.state.playNetwork = this.state.playNetwork === '仅 Wi-Fi' ? '任意网络' : '仅 Wi-Fi';
        this.save();
        App.renderSettings();
    },

    // 主题：system / light / dark
    setTheme(v) {
        this.state.theme = v;
        this.save();
        App.applyTheme();
        App.renderSettings();
    },

    setTabletMode(v) {
        this.state.tabletMode = v;
        this.save();
        App.applyTabletMode();
        App.renderSettings();
    },

    // 通用下拉选项：写值 + 存盘 + 按需重绘
    setOption(key, v, rerender) {
        this.state[key] = v;
        this.save();
        if (typeof Player !== 'undefined' && Player.applySettings) Player.applySettings();
        if (rerender !== false) App.renderSettings();
    },

    // 判断当前是否只允许 Wi-Fi 播放（蜂窝网被限制）
    blockedByNetwork() {
        if (this.state.playNetwork !== '仅 Wi-Fi') return false;
        try {
            const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (c && c.type) return c.type === 'cellular';
        } catch (e) {}
        return false;
    },

    setLyricDelay(v) {
        this.state.lyricDelay = Number(v) || 0;
        this.save();
        const el = document.getElementById('s-lyric-delay-val');
        if (el) el.textContent = (this.state.lyricDelay > 0 ? '+' : '') + this.state.lyricDelay + ' ms';
    },

    setSleep(min) {
        this.state.sleepMinutes = min;
        this.save();
        if (Player.sleepTimer) { clearTimeout(Player.sleepTimer); Player.sleepTimer = null; }
        if (min > 0) {
            Player.sleepTimer = setTimeout(() => {
                Player.audio.pause();
                showToast('睡眠计时器：已暂停播放');
                Settings.state.sleepMinutes = 0;
                Settings.save();
            }, min * 60 * 1000);
            showToast(`睡眠计时器：${min} 分钟后暂停`);
        } else {
            showToast('睡眠计时器已关闭');
        }
        App.renderSettings();
    },

    cycleSleep() {
        const options = [0, 15, 30, 60, 90];
        const idx = options.indexOf(this.state.sleepMinutes);
        this.setSleep(options[(idx + 1) % options.length]);
    },

    // 根据网络类型返回当前生效的音质（蜂窝 / Wi-Fi）
    currentQuality() {
        let cell = false;
        try {
            const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (c && c.type) cell = c.type === 'cellular';
            else if (c && c.effectiveType) cell = !/wifi|ethernet/i.test(String(c.type || '')) && c.effectiveType !== 'wifi';
        } catch (e) { cell = false; }
        return cell ? this.state.qualityCell : this.state.qualityWifi;
    },

    qualityParams() {
        const q = this.currentQuality();
        if (q === '原音质') return null;
        const rate = parseInt(q, 10) || 128;
        return { format: 'mp3', maxBitRate: rate };
    }
};

// ========================================
//  播放器控制
// ========================================
const Player = {
    audio: null,
    queue: [],
    currentIndex: -1,
    isPlaying: false,
    shuffle: false,
    repeat: 'none',
    spectrumOn: false,
    volume: 0.7,
    lyrics: null,
    lyricsPanelOpen: false,

    init() {
        this.audio = document.getElementById('audio-player');
        Settings.load();
        this.audio.volume = this.volume;
        this.audio.addEventListener('timeupdate', () => {
            this.updateProgress();
            this.updateLyrics();
            this.updateMiniLyric();
            this.maybeFadeOut();
            this.maybePreloadNext();
        });
        this.audio.addEventListener('ended', () => this.handleEnded());
        this.audio.addEventListener('loadedmetadata', () => this.updateDuration());
        this.audio.addEventListener('play', () => { this.isPlaying = true; this.updatePlayBtn(); });
        this.audio.addEventListener('pause', () => { this.isPlaying = false; this.updatePlayBtn(); });
        this.audio.addEventListener('error', () => { console.error('Audio error'); this.next(); });
        this.initLyricsTap();
        this.initLyricsSwipe();
        LyricsStyle.load();
        this.applySettings();

        // 点歌词行跳到该句（仅带时间轴的歌词有效）
        const lyricsPanel = document.getElementById('lyrics-panel-content');
        if (lyricsPanel) {
            lyricsPanel.addEventListener('click', (e) => {
                const line = e.target.closest('.lyrics-line');
                if (!line) return;
                const t = parseFloat(line.getAttribute('data-time'));
                if (isFinite(t) && t >= 0) {
                    this.audio.currentTime = t;
                    this.updateProgress();
                    this.updateLyrics();
                }
            });
        }
    },

    // 单击播放器底栏左侧（封面 + 歌名歌手 + 周围空白）打开歌词页
    // 控制区、右侧按钮的点击不算，避免误触
    initLyricsTap() {
        const bar = document.querySelector('.player-bar');
        if (!bar) return;
        bar.addEventListener('click', (e) => {
            if (e.target.closest('.player-controls, .player-right')) return;
            if (!Settings.get('lyricsOn')) return;
            this.toggleLyricsPanel();
        });
    },

    // 歌词页下滑退出（右上角收起按钮已移除）
    initLyricsSwipe() {
        const overlay = document.getElementById('lyrics-overlay');
        if (!overlay || this._lyricsSwipeBound) return;
        this._lyricsSwipeBound = true;
        let startY = 0, startX = 0, tracking = false, dragging = false;

        const restore = (animate) => {
            overlay.style.transition = animate
                ? 'transform .3s cubic-bezier(.22,.61,.36,1), opacity .22s ease'
                : '';
            overlay.style.transform = '';
            overlay.style.opacity = '';
            if (animate) setTimeout(() => { overlay.style.transition = ''; }, 320);
        };

        overlay.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            startY = e.touches[0].clientY;
            startX = e.touches[0].clientX;
            tracking = true;
            dragging = false;
        }, { passive: true });

        overlay.addEventListener('touchmove', (e) => {
            if (!tracking) return;
            const dy = e.touches[0].clientY - startY;
            const dx = Math.abs(e.touches[0].clientX - startX);
            if (!dragging && dy > 26 && dy > dx * 1.2) {
                dragging = true;
                overlay.style.transition = 'none';
            }
            if (dragging) {
                const d = Math.max(0, dy);
                overlay.style.transform = `translateY(${d}px)`;
                overlay.style.opacity = String(Math.max(0.3, 1 - d / 480));
            }
        }, { passive: true });

        const finish = (e) => {
            if (!tracking) return;
            tracking = false;
            const dy = e.changedTouches[0].clientY - startY;
            const dx = Math.abs(e.changedTouches[0].clientX - startX);
            if (!dragging) return;
            dragging = false;
            if (dy > 110 && dy > dx) {
                overlay.style.transition = '';
                overlay.style.transform = '';
                overlay.style.opacity = '';
                Player.closeLyricsPanel();
            } else {
                restore(true);
            }
        };
        overlay.addEventListener('touchend', finish, { passive: true });
        overlay.addEventListener('touchcancel', finish, { passive: true });
    },

    // 设置项生效：音量平衡 / Mini 歌词
    applySettings() {
        this.enableVolumeBalance(!!Settings.get('volumeBalance'));
        if (!Settings.get('miniLyric')) {
            const el = document.getElementById('player-artist');
            const song = this.queue[this.currentIndex];
            if (el && song) el.textContent = song.artist || '';
        }
    },

    initAudioGraph() {
        if (this._graphTried) return;
        this._graphTried = true;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
            this.srcNode = this.ctx.createMediaElementSource(this.audio);
            this.gainNode = this.ctx.createGain();
            this.gainNode.gain.value = 1;
            this.compNode = this.ctx.createDynamicsCompressor();
            this.srcNode.connect(this.gainNode);
            this.gainNode.connect(this.compNode);
            this.compNode.connect(this.ctx.destination);
            // 频谱分析（终端分支，不参与发声链路）
            try {
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 256;
                this.analyser.smoothingTimeConstant = 0.82;
                this.compNode.connect(this.analyser);
            } catch (e) { this.analyser = null; }
            this._graphOk = true;
        } catch (e) {
            console.warn('Audio graph unavailable', e);
            this._graphOk = false;
        }
    },

    // 音量平衡：动态压缩，把忽大忽小的曲目音量压到同一水平
    enableVolumeBalance(on) {
        if (on && !this._graphOk) this.initAudioGraph();
        if (!this._graphOk) {
            if (on) {
                Settings.state.volumeBalance = false;
                Settings.save();
                document.querySelectorAll('[data-toggle="volumeBalance"]').forEach((el) => el.classList.remove('on'));
                showToast('当前音频通路不支持音量平衡');
            }
            return;
        }
        const c = this.compNode;
        if (on) {
            c.threshold.value = -22;
            c.knee.value = 18;
            c.ratio.value = 8;
            c.attack.value = 0.02;
            c.release.value = 0.4;
        } else {
            c.threshold.value = 0;
            c.knee.value = 0;
            c.ratio.value = 1;
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },

    fadeIn() {
        const target = this.volume || 0.7;
        if (this._fadeTimer) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
        if (!Settings.get('crossfade')) {
            this.audio.volume = target;
            if (this.gainNode) this.gainNode.gain.value = 1;
            return;
        }
        // 有 Web Audio 通路时直接推 gain（此时 audio.volume 可能不生效）
        if (this._graphOk && this.gainNode && this.ctx) {
            try {
                this.audio.volume = target;
                this.ctx.resume().catch(() => {});
                const now = this.ctx.currentTime;
                const g = this.gainNode.gain;
                g.cancelScheduledValues(now);
                g.setValueAtTime(0, now);
                g.linearRampToValueAtTime(1, now + 1.2);
                return;
            } catch (e) { /* 退回 volume 方案 */ }
        }
        const durMs = 1200;
        const t0 = performance.now();
        this.audio.volume = 0;
        this._fadeTimer = setInterval(() => {
            const p = Math.min(1, (performance.now() - t0) / durMs);
            this.audio.volume = Math.max(0, Math.min(1, target * p));
            if (p >= 1) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
        }, 50);
    },

    maybeFadeOut() {
        if (!Settings.get('crossfade') || this._fadingOut || !this.isPlaying) return;
        const dur = this.audio.duration || 0;
        if (!dur) return;
        const left = dur - (this.audio.currentTime || 0);
        if (left > 0 && left <= 1.2) {
            this._fadingOut = true;
            const startVol = this.audio.volume;
            const durMs = 1100;
            if (this._graphOk && this.gainNode && this.ctx) {
                try {
                    const now = this.ctx.currentTime;
                    const g = this.gainNode.gain;
                    g.cancelScheduledValues(now);
                    g.setValueAtTime(g.value, now);
                    g.linearRampToValueAtTime(0, now + durMs / 1000);
                    return;
                } catch (e) { /* 退回 volume 方案 */ }
            }
            const t0 = performance.now();
            const timer = setInterval(() => {
                const p = Math.min(1, (performance.now() - t0) / durMs);
                this.audio.volume = Math.max(0, startVol * (1 - p));
                if (p >= 1) clearInterval(timer);
            }, 50);
        }
    },

    maybePreloadNext() {
        if (!Settings.get('gapless')) return;
        const left = (this.audio.duration || 0) - (this.audio.currentTime || 0);
        if (!left || left > 15) return;
        if (this._preloadedIndex === this.currentIndex) return;
        this._preloadedIndex = this.currentIndex;
        const nextIdx = this.currentIndex + 1;
        if (nextIdx >= this.queue.length) return;
        const song = this.queue[nextIdx];
        if (!song) return;
        try {
            const a = new Audio();
            a.preload = 'auto';
            a.src = SubsonicAPI.getStreamUrl(song.id);
        } catch (e) { /* 预加载失败不影响播放 */ }
    },

    updateMiniLyric() {
        if (!Settings.get('miniLyric')) return;
        const el = document.getElementById('player-artist');
        if (!el) return;
        if (!this.lyrics || !this.lyrics.synced || !this.lyrics.lines) {
            const song = this.queue[this.currentIndex];
            if (song) el.textContent = song.artist || '';
            return;
        }
        const t = (this.audio.currentTime || 0) + (Settings.get('lyricDelay') || 0) / 1000;
        let cur = null;
        for (const l of this.lyrics.lines) {
            if (l.time >= 0 && l.time <= t) cur = l;
            else if (l.time > t) break;
        }
        if (cur && cur.text) el.textContent = cur.text;
    },

    playQueue(songs, startIndex = 0) {
        this.queue = songs;
        this.currentIndex = startIndex;
        this.loadAndPlay();
    },

    addToQueue(song) {
        this.queue.push(song);
        if (this.currentIndex === -1) {
            this.currentIndex = this.queue.length - 1;
            this.loadAndPlay();
        }
        showToast(`已添加到队列：${song.title}`);
    },

    async loadAndPlay() {
        if (this.currentIndex < 0 || this.currentIndex >= this.queue.length) return;
        if (Settings.blockedByNetwork()) {
            showToast('已限制为仅 Wi-Fi 在线播放，请连接 Wi-Fi 后重试');
            return;
        }
        const song = this.queue[this.currentIndex];
        const url = SubsonicAPI.getStreamUrl(song.id);
        this.audio.src = url;
        this._fadingOut = false;
        this._preloadedIndex = -1;
        this.audio.play().catch(e => console.error('Play failed:', e));
        this.fadeIn();
        this.updateUI(song);
        this.loadLyrics(song);
        App.highlightPlayingSong();
    },

    async loadLyrics(song) {
        this.lyrics = null;
        const panel = document.getElementById('lyrics-panel-content');

        // 顶部标题 + 封面模糊底
        const titleEl = document.getElementById('lyrics-title');
        const artistEl = document.getElementById('lyrics-artist');
        const backdrop = document.getElementById('lyrics-backdrop');
        if (titleEl) titleEl.textContent = song.title || '';
        if (artistEl) artistEl.textContent = song.artist || '';
        if (backdrop) {
            const coverUrl = SubsonicAPI.getCoverArtUrl(song.coverArt);
            backdrop.style.backgroundImage = coverUrl ? `url("${coverUrl}")` : 'none';
        }
        const coverEl = document.getElementById('lyrics-cover');
        if (coverEl) {
            const artwork = SubsonicAPI.getCoverArtUrl(song.coverArt, 500);
            coverEl.src = artwork || '';
            coverEl.style.display = artwork ? '' : 'none';
        }
        const sourceEl = document.getElementById('lc-source');
        if (sourceEl) sourceEl.textContent = '···';

        if (panel) panel.innerHTML = '<div class="lyrics-loading">加载歌词中...</div>';

        try {
            const result = await SubsonicAPI.getLyrics(song.id, song.artist, song.title);
            if (!result || !result.text) {
                this.lyrics = null;
                if (panel) panel.innerHTML = '<div class="lyrics-empty">暂无歌词</div>';
                return;
            }

            let lines = result.lines || [];
            if (lines.length === 0) {
                if (result.synced) {
                    lines = this.parseLRC(result.text);
                }
                if (lines.length === 0) {
                    lines = result.text.split('\n').map(l => l.trim()).filter(l => l.length > 0).map(text => ({ time: -1, text }));
                }
            }

            const hasTimestamps = lines.some(l => l.time >= 0);
            this.lyrics = { synced: hasTimestamps, lines, raw: result.text, estimated: !hasTimestamps };
            if (sourceEl) sourceEl.textContent = hasTimestamps ? 'EMBEDDED' : 'ONLINE';

            if (panel) {
                panel.innerHTML = lines.map((l, i) =>
                    `<div class="lyrics-line" data-index="${i}" data-time="${l.time}">${escapeHtml(l.text) || '&nbsp;'}</div>`
                ).join('');
            }
        } catch (e) {
            console.error('Lyrics error:', e);
            if (panel) panel.innerHTML = '<div class="lyrics-empty">歌词加载失败</div>';
        }
    },

    parseLRC(text) {
        const lines = [];
        const lrcRegex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/g;
        for (const rawLine of text.split('\n')) {
            let match;
            lrcRegex.lastIndex = 0;
            const timestamps = [];
            let lyricText = '';
            let m;
            lrcRegex.lastIndex = 0;
            while ((m = lrcRegex.exec(rawLine)) !== null) {
                const min = parseInt(m[1]);
                const sec = parseInt(m[2]);
                const ms = m[3] ? parseInt(m[3]) * (m[3].length === 3 ? 1 : 10) : 0;
                timestamps.push(min * 60 + sec + ms / 1000);
                lyricText = m[4] || '';
            }
            if (timestamps.length > 0) {
                for (const t of timestamps) {
                    lines.push({ time: t, text: lyricText.trim() });
                }
            } else if (rawLine.trim()) {
                lines.push({ time: -1, text: rawLine.trim() });
            }
        }
        lines.sort((a, b) => a.time - b.time);
        return lines;
    },

    updateLyrics() {
        if (!this.lyrics || !this.lyricsPanelOpen) return;
        const cur = Math.max(0, (this.audio.currentTime || 0) + (Settings.get('lyricDelay') || 0) / 1000);
        const dur = this.audio.duration || 0;
        const lines = this.lyrics.lines;
        const panel = document.getElementById('lyrics-panel-content');
        if (!panel) return;

        let activeIndex = -1;

        if (this.lyrics.synced) {
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].time >= 0 && lines[i].time <= cur) {
                    activeIndex = i;
                } else if (lines[i].time > cur) {
                    break;
                }
            }
        } else if (this.lyrics.estimated && dur > 0) {
            const effectiveLines = lines;
            const totalLines = effectiveLines.length;
            if (totalLines > 0) {
                const progress = cur / dur;
                const adjustedProgress = Math.max(0, Math.min(1, progress));
                activeIndex = Math.floor(adjustedProgress * (totalLines - 1));
            }
        }

        const lineEls = panel.querySelectorAll('.lyrics-line');
        lineEls.forEach((el, i) => {
            const isActive = i === activeIndex;
            el.classList.toggle('active', isActive);
            const d = activeIndex < 0 ? 99 : Math.abs(i - activeIndex);
            el.classList.toggle('ln1', !isActive && d === 1);
            el.classList.toggle('ln2', !isActive && d === 2);
            el.classList.toggle('ln3', !isActive && d >= 3);
        });

        if (activeIndex >= 0 && lineEls[activeIndex]) {
            const activeEl = lineEls[activeIndex];
            const targetScroll = activeEl.offsetTop - panel.clientHeight / 2 + activeEl.clientHeight / 2;
            const currentScroll = panel.scrollTop;
            const diff = targetScroll - currentScroll;
            if (Math.abs(diff) > 2) {
                panel.scrollTop = currentScroll + diff * 0.15;
            }
        }
    },

    toggleLyricsPanel() {
        const overlay = document.getElementById('lyrics-overlay');
        if (!overlay) return;
        this.lyricsPanelOpen = !this.lyricsPanelOpen;
        overlay.classList.toggle('active', this.lyricsPanelOpen);
        if (this.lyricsPanelOpen) {
            App.applyShellTheme(false);
            this.updateProgress();
            this.updateDuration();
            this.updatePlayBtn();
            this.syncFooterState();
            if (this.lyrics) this.updateLyrics();
        } else {
            App.applyTheme();
        }
    },

    closeLyricsPanel() {
        this.lyricsPanelOpen = false;
        const overlay = document.getElementById('lyrics-overlay');
        if (overlay) overlay.classList.remove('active');
        LyricsStyle.closeSettings();
        QueuePanel.close();
        App.applyTheme();
    },

    closeSongActions() {
        const el = document.getElementById('ss-overlay');
        if (el) el.remove();
        const info = document.getElementById('si-overlay');
        if (info) info.remove();
    },

    songAction(act, song) {
        if (act === 'close') { this.closeSongActions(); return; }
        if (act === 'playlist') {
            this.closeSongActions();
            App.addSongToPlaylist(song);
            return;
        }
        if (act === 'next') {
            this.closeSongActions();
            this.queue.splice(this.currentIndex + 1, 0, song);
            showToast('已设为下一首播放');
            return;
        }
        if (act === 'share') {
            this.closeSongActions();
            const text = `《${song.title || ''}》- ${song.artist || ''}${song.album ? '（专辑：' + song.album + '）' : ''} · 来自 Salt Wave`;
            copyText(text).then(() => showToast('歌曲信息已复制，可粘贴分享'))
                .catch(() => showToast('复制失败'));
            return;
        }
        if (act === 'artist') {
            this.closeSongActions();
            if (this.lyricsPanelOpen) this.closeLyricsPanel();
            if (song.artist) App.searchArtist(song.artist);
            return;
        }
        if (act === 'album') {
            this.closeSongActions();
            if (this.lyricsPanelOpen) this.closeLyricsPanel();
            if (song.albumId) App.openAlbum(song.albumId);
            else showToast('这首歌没有关联专辑信息');
            return;
        }
        if (act === 'repeat') {
            this.toggleRepeat();
            return;
        }
        if (act === 'info') {
            this.closeSongActions();
            this.showSongInfo(song);
            return;
        }
        if (act === 'remove') {
            this.closeSongActions();
            this.removeCurrentFromQueue();
            return;
        }
    },

    showSongInfo(song) {
        let quality = '原音质';
        try { quality = Settings.currentQuality(); } catch (e) {}
        const rows = [
            ['标题', song.title || ''],
            ['艺术家', song.artist || ''],
            ['专辑', song.album || ''],
            ['时长', formatTime(song.duration)],
            ['音质', quality],
            ['歌曲 ID', song.id || ''],
            ['专辑 ID', song.albumId || '—']
        ].map(([k, v]) => `<div class="si-row"><span class="si-key">${k}</span><span class="si-val">${escapeHtml(String(v))}</span></div>`).join('');
        const overlay = document.createElement('div');
        overlay.id = 'si-overlay';
        overlay.className = 'si-overlay';
        overlay.innerHTML = `<div class="si-card">
            <div class="si-title">歌曲信息</div>
            ${rows}
            <button class="si-btn">关闭</button>
        </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay || e.target.closest('.si-btn')) overlay.remove();
        });
    },

    removeCurrentFromQueue() {
        if (this.queue.length <= 1) { showToast('队列里只剩这一首'); return; }
        const wasPlaying = this.isPlaying;
        this.queue.splice(this.currentIndex, 1);
        if (this.currentIndex >= this.queue.length) this.currentIndex = this.queue.length - 1;
        this.loadAndPlay();
        showToast('已从播放队列移除');
    },

    togglePlay() {
        if (this.currentIndex < 0) {
            if (this.queue.length > 0) { this.currentIndex = 0; this.loadAndPlay(); }
            return;
        }
        if (this.isPlaying) this.audio.pause();
        else this.audio.play();
    },

    next() {
        if (this.queue.length === 0) return;
        if (this.shuffle) {
            this.currentIndex = Math.floor(Math.random() * this.queue.length);
        } else {
            this.currentIndex++;
            if (this.currentIndex >= this.queue.length) {
                if (this.repeat === 'all') this.currentIndex = 0;
                else { this.currentIndex = this.queue.length - 1; return; }
            }
        }
        this.loadAndPlay();
    },

    prev() {
        if (this.queue.length === 0) return;
        if (this.audio.currentTime > 3) { this.audio.currentTime = 0; return; }
        this.currentIndex--;
        if (this.currentIndex < 0) {
            if (this.repeat === 'all') this.currentIndex = this.queue.length - 1;
            else this.currentIndex = 0;
        }
        this.loadAndPlay();
    },

    handleEnded() {
        if (Settings.get('pauseAfterTrack')) {
            this.isPlaying = false;
            this.updatePlayBtn();
            return;
        }
        if (this.repeat === 'one') {
            this.audio.currentTime = 0;
            this.audio.play();
        } else {
            this.next();
        }
    },

    seek(event) {
        const track = document.getElementById('progress-track');
        const rect = track.getBoundingClientRect();
        let percent = (event.clientX - rect.left) / rect.width;
        percent = Math.max(0, Math.min(1, percent));
        const dur = this.audio.duration;
        if (dur && isFinite(dur) && dur > 0) {
            this.audio.currentTime = percent * dur;
            this.updateProgress();
            this.updateLyrics();
        }
    },

    // 歌词页底部控制条的进度点击（与主播放器共用同一个 audio 元素）
    seekLyrics(event) {
        const track = document.getElementById('lc-track');
        if (!track) return;
        const rect = track.getBoundingClientRect();
        let percent = (event.clientX - rect.left) / rect.width;
        percent = Math.max(0, Math.min(1, percent));
        const dur = this.audio.duration;
        if (dur && isFinite(dur) && dur > 0) {
            this.audio.currentTime = percent * dur;
            this.updateProgress();
            this.updateLyrics();
        }
    },

    setVolume(event) {
        const track = document.getElementById('volume-track');
        const rect = track.getBoundingClientRect();
        const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        this.volume = percent;
        this.audio.volume = percent;
        document.getElementById('volume-fill').style.width = (percent * 100) + '%';
    },

    toggleShuffle() {
        this.shuffle = !this.shuffle;
        document.getElementById('shuffle-btn').classList.toggle('active', this.shuffle);
        const lcShuffle = document.getElementById('lc-shuffle');
        if (lcShuffle) lcShuffle.classList.toggle('active', this.shuffle);
        showToast(this.shuffle ? '随机播放已开启' : '随机播放已关闭');
    },

    toggleRepeat() {
        const modes = ['none', 'all', 'one'];
        const idx = modes.indexOf(this.repeat);
        this.repeat = modes[(idx + 1) % modes.length];
        const btn = document.getElementById('repeat-btn');
        if (btn) btn.classList.toggle('active', this.repeat !== 'none');
        const lcRepeat = document.getElementById('lc-repeat');
        if (lcRepeat) lcRepeat.classList.toggle('active', this.repeat !== 'none');
        const ssRepeat = document.getElementById('ss-repeat-val');
        if (ssRepeat) ssRepeat.textContent = this.repeatLabel();
        showToast(this.repeat === 'none' ? '顺序播放' : this.repeat === 'all' ? '列表循环' : '单曲循环');
    },

    repeatLabel() {
        return this.repeat === 'all' ? '列表循环' : this.repeat === 'one' ? '单曲循环' : '顺序播放';
    },

    // 打开睡眠计时器选择
    openSleepPicker() {
        const cur = Settings.get('sleepMinutes') || 0;
        App.openPicker('睡眠计时器', [
            { value: 0, label: '关闭' },
            { value: 15, label: '15 分钟' },
            { value: 30, label: '30 分钟' },
            { value: 60, label: '60 分钟' },
            { value: 90, label: '90 分钟' }
        ], cur, (v) => {
            Settings.setSleep(Number(v));
            this.syncFooterState();
        });
    },

    // 底部按钮状态同步（随机 / 睡眠 / 频谱）
    syncFooterState() {
        const sh = document.getElementById('lc-shuffle');
        if (sh) sh.classList.toggle('active', !!this.shuffle);
        const sl = document.getElementById('lc-sleep');
        const badge = document.getElementById('lc-sleep-badge');
        const mins = Settings.get('sleepMinutes') || 0;
        if (sl) sl.classList.toggle('active', mins > 0);
        if (badge) {
            badge.textContent = mins > 0 ? String(mins) : '';
            badge.classList.toggle('on', mins > 0);
        }
        const sp = document.getElementById('lc-spectrum-btn');
        if (sp) sp.classList.toggle('active', !!this.spectrumOn);
    },

    // 频谱可视化（走 Web Audio AnalyserNode，非假动画）
    toggleSpectrum() {
        if (!this.analyser) this.initAudioGraph();
        if (!this.analyser) {
            showToast('音频通路不可用，无法开启频谱');
            return;
        }
        this.spectrumOn = !this.spectrumOn;
        const cv = document.getElementById('lc-spectrum');
        if (cv) cv.style.display = this.spectrumOn ? 'block' : 'none';
        this.syncFooterState();
        if (this.spectrumOn) {
            this.startSpectrum();
        } else {
            this.stopSpectrum();
        }
    },

    startSpectrum() {
        this.stopSpectrum();
        const cv = document.getElementById('lc-spectrum');
        if (!cv || !this.analyser) return;
        const g = cv.getContext('2d');
        const data = new Uint8Array(this.analyser.frequencyBinCount);
        const draw = () => {
            if (!this.spectrumOn) return;
            const dpr = window.devicePixelRatio || 1;
            const w = cv.clientWidth || 320;
            const h = cv.clientHeight || 46;
            if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
                cv.width = Math.round(w * dpr);
                cv.height = Math.round(h * dpr);
            }
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
            g.clearRect(0, 0, w, h);
            this.analyser.getByteFrequencyData(data);
            const bars = 40;
            const gap = 2;
            const bw = Math.max(2, (w - gap * (bars - 1)) / bars);
            const mid = h - 6;
            for (let i = 0; i < bars; i++) {
                const di = Math.floor((i * data.length * 0.55) / bars);
                const v = (data[di] || 0) / 255;
                const bh = Math.max(2, Math.pow(v, 1.25) * (mid - 2));
                const x = i * (bw + gap);
                const grad = g.createLinearGradient(0, mid, 0, mid - bh);
                grad.addColorStop(0, 'rgba(255,127,118,.28)');
                grad.addColorStop(1, 'rgba(255,170,160,.95)');
                g.fillStyle = grad;
                g.fillRect(x, mid - bh, bw, bh);
            }
            this._specRaf = requestAnimationFrame(draw);
        };
        this._specRaf = requestAnimationFrame(draw);
    },

    stopSpectrum() {
        if (this._specRaf) { cancelAnimationFrame(this._specRaf); this._specRaf = null; }
    },

    updateProgress() {
        const cur = this.audio.currentTime || 0;
        const dur = this.audio.duration || 0;
        const percent = dur > 0 ? (cur / dur) * 100 : 0;
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('current-time').textContent = formatTime(cur);
        const lcFill = document.getElementById('lc-fill');
        const lcTime = document.getElementById('lc-time');
        if (lcFill) lcFill.style.width = percent + '%';
        if (lcTime) lcTime.textContent = formatTime(cur);
    },

    updateDuration() {
        const total = formatTime(this.audio.duration);
        document.getElementById('total-time').textContent = total;
        const lcTotal = document.getElementById('lc-total');
        if (lcTotal) lcTotal.textContent = total;
    },

    updatePlayBtn() {
        const icon = document.getElementById('play-icon');
        const lcIcon = document.getElementById('lc-play-icon');
        if (this.isPlaying) {
            icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            if (lcIcon) lcIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
            icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
            if (lcIcon) lcIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        }
    },

    updateUI(song) {
        document.getElementById('player-title').textContent = song.title || '未知';
        document.getElementById('player-artist').textContent = song.artist || '';
        const coverEl = document.getElementById('player-cover');
        const coverUrl = SubsonicAPI.getCoverArtUrl(song.coverArt);
        if (coverUrl) {
            coverEl.innerHTML = `<img src="${coverUrl}" alt="" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:20px;\\'>♪</div>'">`;
        } else {
            coverEl.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:20px;">♪</div>';
        }
    },

    getCurrentSongId() {
        if (this.currentIndex >= 0 && this.currentIndex < this.queue.length) {
            return this.queue[this.currentIndex].id;
        }
        return null;
    }
};

//  歌词样式设置（点歌词页左下角“词”徽标打开）

const LyricsStyle = {
    key: 'saltwave_lyrics_style',
    state: { size: 17, alignCenter: true, weight: 400, blur: true, stagger: false, lineHeight: 2.1, activeScale: 1.29, activeColor: '#ffffff' },

    load() {
        try {
            const saved = JSON.parse(localStorage.getItem(this.key) || 'null');
            if (saved) Object.assign(this.state, saved);
        } catch (e) { /* 忽略损坏的本地配置 */ }
        this.apply();
    },

    save() {
        try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {}
    },

    apply() {
        const panel = document.querySelector('.lyrics-panel');
        if (panel) {
            panel.style.setProperty('--ly-size', this.state.size + 'px');
            panel.style.setProperty('--ly-align', this.state.alignCenter ? 'center' : 'left');
            panel.style.setProperty('--ly-weight', String(this.state.weight));
            panel.style.setProperty('--ly-lh', String(this.state.lineHeight || 2.1));
            panel.style.setProperty('--ly-active-size', Math.round(this.state.size * (this.state.activeScale || 1.29)) + 'px');
            panel.style.setProperty('--ly-active-color', this.state.activeColor || '#ffffff');
            panel.style.setProperty('--ly-active-weight', String(Math.min(900, this.state.weight + 300)));
            panel.setAttribute('data-ly-blur', this.state.blur ? 'on' : 'off');
            panel.setAttribute('data-ly-stagger', this.state.stagger ? 'on' : 'off');
        }
        this.syncUI();
    },

    syncUI() {
        const sizeEl = document.getElementById('ls-size');
        const sizeVal = document.getElementById('ls-size-val');
        const weightEl = document.getElementById('ls-weight');
        const weightVal = document.getElementById('ls-weight-val');
        const alignEl = document.getElementById('ls-align');
        const blurEl = document.getElementById('ls-blur');
        const staggerEl = document.getElementById('ls-stagger');
        if (sizeEl) sizeEl.value = this.state.size;
        if (sizeVal) sizeVal.textContent = this.state.size;
        if (weightEl) weightEl.value = this.state.weight;
        if (weightVal) weightVal.textContent = this.state.weight;
        if (alignEl) alignEl.classList.toggle('on', this.state.alignCenter);
        if (blurEl) blurEl.classList.toggle('on', this.state.blur);
        if (staggerEl) staggerEl.classList.toggle('on', this.state.stagger);

        const lhEl = document.getElementById('ls-lh');
        const lhVal = document.getElementById('ls-lh-val');
        const scaleEl = document.getElementById('ls-scale');
        const scaleVal = document.getElementById('ls-scale-val');
        if (lhEl) lhEl.value = this.state.lineHeight || 2.1;
        if (lhVal) lhVal.textContent = (this.state.lineHeight || 2.1).toFixed(1);
        if (scaleEl) scaleEl.value = this.state.activeScale || 1.29;
        if (scaleVal) scaleVal.textContent = (this.state.activeScale || 1.29).toFixed(2);
        document.querySelectorAll('.ls-swatch').forEach((el) => {
            el.classList.toggle('active', el.style.getPropertyValue('--sw').trim().toLowerCase() === (this.state.activeColor || '#ffffff').toLowerCase());
        });
        const advSrc = document.getElementById('ls-adv-source');
        const mainSrc = document.getElementById('ls-source-value');
        if (advSrc && mainSrc) advSrc.textContent = mainSrc.textContent;
    },

    setSize(v) { this.state.size = Number(v) || 17; this.save(); this.apply(); },
    setWeight(v) { this.state.weight = Number(v) || 400; this.save(); this.apply(); },
    setLineHeight(v) { this.state.lineHeight = Number(v) || 2.1; this.save(); this.apply(); },
    setActiveScale(v) { this.state.activeScale = Number(v) || 1.29; this.save(); this.apply(); },
    setActiveColor(color, el) { this.state.activeColor = color; this.save(); this.apply(); },
    toggleAlign() { this.state.alignCenter = !this.state.alignCenter; this.save(); this.apply(); },
    toggleBlur() { this.state.blur = !this.state.blur; this.save(); this.apply(); },
    toggleStagger() { this.state.stagger = !this.state.stagger; this.save(); this.apply(); },

    resetAdvanced() {
        this.state.lineHeight = 2.1;
        this.state.activeScale = 1.29;
        this.state.activeColor = '#ffffff';
        this.save();
        this.apply();
        showToast('已恢复默认参数');
    },

    openAdvanced() {
        const overlay = document.getElementById('lyrics-adv-overlay');
        this.syncUI();
        if (overlay) overlay.classList.add('open');
    },

    closeAdvanced() {
        const overlay = document.getElementById('lyrics-adv-overlay');
        if (overlay) overlay.classList.remove('open');
    },

    isAdvancedOpen() {
        const el = document.getElementById('lyrics-adv-overlay');
        return !!(el && el.classList.contains('open'));
    },

    openSettings() {
        const overlay = document.getElementById('lyrics-settings-overlay');
        const src = document.getElementById('lc-source');
        const srcValue = document.getElementById('ls-source-value');
        if (src && srcValue) srcValue.textContent = src.textContent;
        this.syncUI();
        if (overlay) overlay.classList.add('open');
    },

    closeSettings() {
        const overlay = document.getElementById('lyrics-settings-overlay');
        if (overlay) overlay.classList.remove('open');
        this.closeAdvanced();
    }
};

// ========================================
//  播放列表（当前播放队列）
// ========================================
const QueuePanel = {
    isOpen() {
        const el = document.getElementById('queue-overlay');
        return !!(el && el.classList.contains('open'));
    },

    open() {
        this.render();
        const overlay = document.getElementById('queue-overlay');
        if (overlay) overlay.classList.add('open');
        this.scrollToCurrent();
    },

    close() {
        const overlay = document.getElementById('queue-overlay');
        if (overlay) overlay.classList.remove('open');
    },

    render() {
        const list = document.getElementById('queue-list');
        const meta = document.getElementById('queue-meta');
        if (!list) return;
        const queue = Player.queue || [];
        const cur = Player.currentIndex;

        if (meta) {
            meta.textContent = queue.length
                ? `共 ${queue.length} 首${cur >= 0 ? ` · 正在播放第 ${cur + 1} 首` : ''}`
                : '';
        }
        if (queue.length === 0) {
            list.innerHTML = '<div class="queue-empty">还没有播放列表，先点一首歌吧</div>';
            return;
        }
        list.innerHTML = queue.map((song, i) => {
            const active = i === cur ? ' active' : '';
            return `<div class="queue-item${active}" onclick="QueuePanel.play(${i})">
                <span class="queue-index">${i === cur ? '▶' : i + 1}</span>
                <span class="queue-info">
                    <span class="queue-title">${escapeHtml(song.title || '未知')}</span>
                    <span class="queue-artist">${escapeHtml(song.artist || '')}</span>
                </span>
            </div>`;
        }).join('');
    },

    scrollToCurrent() {
        const list = document.getElementById('queue-list');
        if (!list) return;
        const active = list.querySelector('.queue-item.active');
        if (!active) return;
        list.scrollTop = active.offsetTop - list.clientHeight / 2 + active.clientHeight / 2;
    },

    play(index) {
        if (!Player.queue[index]) return;
        Player.currentIndex = index;
        Player.loadAndPlay();
        this.render();
        this.scrollToCurrent();
        this.close();
    }
};

// ========================================
//  应用逻辑
// ========================================
const App = {
    currentView: 'home',
    cache: { albums: [], artists: [], songs: [], playlists: [] },
    songLists: {},
    _listSeq: 0,
    searchTimer: null,
    homeSeed: 0,
    serviceOnline: null,

    async login() {
        const serverUrlRaw = document.getElementById('server-url').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');
        if (btn.disabled) return;

        if (!serverUrlRaw || !username || !password) {
            errorEl.textContent = '请填写所有字段';
            return;
        }

        // 自动补全协议前缀
        let serverUrl = serverUrlRaw;
        if (!/^https?:\/\//i.test(serverUrl)) {
            serverUrl = 'http://' + serverUrl;
        }
        serverUrl = serverUrl.replace(/\/+$/, '');

        btn.disabled = true;
        btn.textContent = '连接中...';
        errorEl.style.color = 'var(--text-dim)';
        errorEl.textContent = '正在连接服务器…';

        try {
            SubsonicAPI.init(serverUrl, username, password);
            await SubsonicAPI.ping();

            localStorage.setItem('navidrome_server', serverUrl);
            localStorage.setItem('navidrome_user', username);
            localStorage.setItem('navidrome_pass', password);

            this.showApp();
            this.navigate('home');
        } catch (e) {
            errorEl.style.color = '';
            let msg = e.message || '';
            if (msg.includes('Failed to fetch') || msg.includes('无法连接')) {
                errorEl.textContent = '无法连接服务器，请检查地址是否正确，确保服务器已开启 CORS';
            } else if (msg.includes('Wrong username or password') || msg.includes('401') || msg.includes('403')) {
                errorEl.textContent = '用户名或密码错误';
            } else {
                errorEl.style.color = '';
            errorEl.textContent = '连接失败：' + msg;
            }
            btn.disabled = false;
            btn.textContent = '连接';
        }
    },

    autoLogin() {
        const server = localStorage.getItem('navidrome_server');
        const user = localStorage.getItem('navidrome_user');
        const pass = localStorage.getItem('navidrome_pass');
        if (server && user && pass) {
            SubsonicAPI.init(server, user, pass);
            SubsonicAPI.ping().then(() => {
                this.showApp();
                this.navigate('home');
            }).catch(() => {});
        }
    },

    showApp() {
        window.__appShown = true;
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('app').classList.add('active');
    },

    logout() {
        localStorage.removeItem('navidrome_server');
        localStorage.removeItem('navidrome_user');
        localStorage.removeItem('navidrome_pass');
        location.reload();
    },

    navigate(view) {
        this.currentView = view;
        this.detailParent = null;
        this.songLists = {};
        this.navStack = this.navStack || [];
        if (this.navStack[this.navStack.length - 1] !== view) {
            this.navStack.push(view);
            if (this.navStack.length > 30) this.navStack.shift();
        }
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.view === view);
        });
        const lightView = (view === 'home' || view === 'settings');
        document.getElementById('app').classList.toggle('home-mode', lightView);
        document.getElementById('app').classList.toggle('settings-mode', view === 'settings');
        document.getElementById('app').classList.toggle('playlists-mode', view === 'playlists');
        this.applyTheme();
        const content = document.getElementById('page-content');

        switch (view) {
            case 'home': this.renderHome(); break;
            case 'settings': this.renderSettings(); break;
            case 'albums': this.renderAlbums(); break;
            case 'artists': this.renderArtists(); break;
            case 'songs': this.renderSongs(); break;
            case 'playlists': this.renderPlaylists(); break;
            case 'starred': this.renderStarred(); break;
            case 'genres': this.renderGenres(); break;
            case 'search': this.focusSearch(); break;
        }
        this.syncRail();
    },

    // 平板 / 车机布局：宽屏横屏自动启用，也可在设置里强制开关
    applyTabletMode() {
        const mode = Settings.get('tabletMode') || 'auto';
        const w = window.innerWidth || document.documentElement.clientWidth || 0;
        const h = window.innerHeight || document.documentElement.clientHeight || 0;
        const wide = w >= 900 && w > h * 1.15;
        const on = mode === 'on' || (mode === 'auto' && wide);
        document.documentElement.classList.toggle('tablet-mode', on);
        document.body.classList.toggle('tablet-mode', on);
        this.syncRail();
        if (!this._tabletBound) {
            this._tabletBound = true;
            let timer = null;
            const relayout = () => {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => this.applyTabletMode(), 120);
            };
            window.addEventListener('resize', relayout);
            window.addEventListener('orientationchange', relayout);
        }
    },

    isTabletMode() {
        return document.documentElement.classList.contains('tablet-mode');
    },

    syncRail() {
        const view = this.currentView || 'home';
        document.querySelectorAll('.rail-item').forEach((el) => {
            el.classList.toggle('active', el.dataset.view === view);
        });
    },

    // 当前浅色壳是否用浅色（主题 = 浅色 / 跟随系统）
    prefersLight() {
        const t = Settings.get('theme') || 'system';
        if (t === 'light') return true;
        if (t === 'dark') return false;
        try { return !window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
    },

    // 应用主题：首页/设置这套壳切浅色或深色，并同步系统栏明暗
    applyTheme() {
        const isLightView = (this.currentView === 'home' || this.currentView === 'settings');
        const light = isLightView && this.prefersLight();
        const dark = !light;
        document.getElementById('app').classList.toggle('dark-ui', dark);
        document.documentElement.classList.toggle('dark-ui', dark);
        this.applyShellTheme(light);
    },

    // 切换系统状态栏/导航栏明暗（仅 APK 内由原生桥接实现，网页端静默忽略）
    applyShellTheme(light) {
        try {
            if (window.SaltWaveNative && window.SaltWaveNative.setTheme) {
                window.SaltWaveNative.setTheme(!!light);
            }
        } catch (e) { /* 非 APK 环境 */ }
    },

    // 跟随系统明暗变化
    watchSystemTheme() {
        try {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            const handler = () => {
                if ((Settings.get('theme') || 'system') === 'system') this.applyTheme();
            };
            if (mq.addEventListener) mq.addEventListener('change', handler);
            else if (mq.addListener) mq.addListener(handler);
        } catch (e) {}
    },

    // 底部选项弹窗：title + 选项列表 + 当前值 + 回调
    openPicker(title, options, current, onPick) {
        this.closePicker();
        const check = '<svg class="pick-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>';
        const rows = options.map((o) => {
            const val = (o && o.value !== undefined) ? o.value : o;
            const label = (o && o.label !== undefined) ? o.label : o;
            const on = String(val) === String(current) ? ' on' : '';
            return `<button class="pick-row${on}" data-val="${escapeHtml(String(val))}">
                <span class="pick-label">${escapeHtml(String(label))}</span>${check}
            </button>`;
        }).join('');
        const overlay = document.createElement('div');
        overlay.id = 'pick-overlay';
        overlay.className = 'pick-overlay';
        overlay.innerHTML = `<div class="pick-sheet">
            <div class="pick-title">${escapeHtml(title)}</div>
            <div class="pick-list">${rows}</div>
            <button class="pick-cancel">取消</button>
        </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) { this.closePicker(); return; }
            const cancel = e.target.closest('.pick-cancel');
            if (cancel) { this.closePicker(); return; }
            const row = e.target.closest('.pick-row');
            if (row) {
                const val = row.dataset.val;
                this.closePicker();
                try { onPick(val); } catch (err) { console.error(err); }
            }
        });
    },

    closePicker() {
        const el = document.getElementById('pick-overlay');
        if (el) el.remove();
    },

    async renderHome() {
        const content = document.getElementById('page-content');
        content.innerHTML = '<div class="home" style="padding-top:110px;"><div class="loading" style="color:#7a7a80;"><div class="spinner"></div>加载中...</div></div>';

        let albums = [], playlists = [], artists = [], genres = [], starred = [], recent = [], randoms = [];
        try {
            [albums, playlists, artists, genres, starred, recent, randoms] = await Promise.all([
                SubsonicAPI.getAllAlbums().catch(() => []),
                SubsonicAPI.getPlaylists().catch(() => []),
                SubsonicAPI.getArtists().catch(() => []),
                SubsonicAPI.getGenres().catch(() => []),
                SubsonicAPI.getStarred2().catch(() => []),
                SubsonicAPI.getAlbumList('newest', 6).catch(() => []),
                SubsonicAPI.getRandomSongs(40).catch(() => [])
            ]);
        } catch (e) { /* 单项失败不影响整体 */ }

        this.cache.albums = albums.length ? albums : recent;
        this.starredSongs = starred;

        const coverIds = [];
        [...recent, ...albums].forEach((a) => {
            if (a && a.coverArt && coverIds.indexOf(a.coverArt) === -1) coverIds.push(a.coverArt);
        });

        const collage = (offset) => {
            if (coverIds.length === 0) return '';
            let html = '';
            for (let k = 0; k < 4; k++) {
                const id = coverIds[(offset + k) % coverIds.length];
                html += `<img src="${SubsonicAPI.getCoverArtUrl(id, 180)}" alt="">`;
            }
            return html;
        };

        const songCount = albums.reduce((n, a) => n + (Number(a.songCount) || 0), 0);

        // 精选推荐：每次随机取一首歌（避开上一次推荐的同一首），刷新即换
        let featured = null;
        if (randoms.length) {
            const prevId = this.featuredSongId;
            const pool = randoms.filter((s) => s && s.id !== prevId);
            const source = pool.length ? pool : randoms;
            const pick = source[Math.floor(Math.random() * source.length)];
            if (pick) {
                featured = {
                    title: pick.title || '未知',
                    artist: pick.artist || '',
                    album: pick.album || '',
                    coverArt: pick.coverArt || pick.id
                };
                this.featuredSongId = pick.id;
                this.featuredSong = pick;
            }
        }
        if (!featured) {
            const fallbackPool = recent.length ? recent : albums;
            const a = fallbackPool.length ? fallbackPool[Math.floor(Math.random() * fallbackPool.length)] : null;
            if (a) featured = { title: a.name || '未知专辑', artist: a.artist || '', album: '', coverArt: a.coverArt };
        }
        const featuredCover = featured && featured.coverArt ? SubsonicAPI.getCoverArtUrl(featured.coverArt, 600) : '';
        this.homeRandoms = randoms;
        const userName = SubsonicAPI.username || 'Salt Wave';

        const cards = [
            { name: '歌曲', count: songCount, view: 'songs', art: collage(0) },
            { name: '播放列表', count: playlists.length, view: 'playlists', art: collage(1) },
            { name: '专辑', count: albums.length, view: 'albums', art: collage(2) },
            { name: '表演者', count: artists.length, view: 'artists', art: collage(3) },
            { name: '流派', count: genres.length, view: 'genres', art: collage(4) },
            { name: 'Radios', empty: true }
        ];

        const cardHTML = (c) => c.empty
            ? `<button class="lib-card" onclick="showToast('Radios 暂无内容')">
                   <div class="lib-art single"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12a10 10 0 0 1 20 0"/><circle cx="12" cy="12" r="2"/><path d="M5.5 16a7 7 0 0 0 13 0"/></svg></div>
                   <div class="lib-meta"><span class="lib-name">Radios</span><span class="lib-empty">暂无内容</span></div>
               </button>`
            : `<button class="lib-card" onclick="App.navigate('${c.view}')">
                   <div class="lib-art">${c.art}</div>
                   <div class="lib-meta">
                       <span class="lib-name">${c.name}</span>
                       ${c.count ? `<span class="lib-count">${c.count}</span>` : `<span class="lib-empty">暂无内容</span>`}
                   </div>
               </button>`;

        const favHTML = starred.length
            ? starred.slice(0, 12).map((s, i) => `
                <button class="fav-card" onclick="App.playStarred(${i})">
                    <div class="fav-cover"><img src="${SubsonicAPI.getCoverArtUrl(s.coverArt || s.id, 260)}" alt=""></div>
                    <div class="fav-title">${escapeHtml(s.title || '未知')}</div>
                    <div class="fav-artist">${escapeHtml(s.artist || '')}</div>
                </button>`).join('')
            : `<div class="home-sec-sub" style="margin:0;">还没有收藏歌曲</div>`;

        content.innerHTML = `
            <div class="home">
                <div class="home-hero-bg" style="${featuredCover ? `background-image:url('${featuredCover}')` : ''}"></div>
                <div class="home-hero-mask"></div>

                <div class="home-head">
                    <div class="home-name">${escapeHtml(userName)}</div>
                    <button class="home-circle" onclick="App.openSettings()" title="设置">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>

                <section class="home-feature">
                    <div class="home-feature-cover">
                        ${featuredCover ? `<img src="${featuredCover}" alt="">` : ''}
                    </div>
                    <div class="home-feature-info">
                        <span class="home-chip">精选推荐</span>
                        <div class="home-feature-title">${escapeHtml(featured ? (featured.title || '暂无推荐') : '暂无推荐')}</div>
                        <div class="home-feature-artist">${escapeHtml(featured ? (featured.artist || '') : '连接 Navidrome 后显示')}</div>
                        <div class="home-feature-actions">
                            <button class="home-play-btn" onclick="App.playFeatured()">
                                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>随手听听
                            </button>
                            <button class="home-cast-btn${this.serviceOnline === false ? ' offline' : ''}" onclick="App.showServiceStatus()" title="音乐库状态">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.6 8.9a16 16 0 0 1 20.8 0"/><path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M8.4 16.1a6 6 0 0 1 7.2 0"/><circle cx="12" cy="20" r="1.1" fill="currentColor" stroke="none"/></svg>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="home-lib">
                    <div class="home-sec-head">
                        <div class="home-sec-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#f0743e" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>音乐库
                        </div>
                        <button class="home-refresh" onclick="App.refreshHome()" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
                        </button>
                    </div>
                    <div class="home-sec-sub">浏览歌曲、播放列表、专辑、表演者、流派和 Radios</div>
                    <div class="home-grid">${cards.map(cardHTML).join('')}</div>
                </section>

                <section class="home-fav">
                    <div class="home-sec-head">
                        <div class="home-sec-title">
                            <svg viewBox="0 0 24 24" fill="#e2605a" stroke="none"><path d="M12 21s-7.5-4.6-9.4-9A5.2 5.2 0 0 1 12 5.6a5.2 5.2 0 0 1 9.4 6.4c-1.9 4.4-9.4 9-9.4 9z"/></svg>我的最爱
                        </div>
                        <button class="home-more" onclick="App.navigate('starred')">更多
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="9 6 15 12 9 18"/></svg>
                        </button>
                        <button class="home-refresh" onclick="App.refreshHome()" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
                        </button>
                    </div>
                    <div class="home-sec-sub">最近在 Navidrome 里收藏了 ${starred.length} 首歌曲</div>
