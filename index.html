<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>Salt Wave - Navidrome 播放器</title>
    <!-- CryptoJS for MD5 token authentication (本地文件，离线/APK 可用) -->
    <script src="libs/crypto-js.min.js"></script>
    <script>
    (function () {
        function fatal(tag, msg) {
            if (window.__appShown) { try { console.error('[fatal]', tag, msg); } catch (e) {} return; }
            try {
                var old = document.getElementById('boot-fatal');
                if (old && old.parentNode) old.parentNode.removeChild(old);
                var d = document.createElement('div');
                d.id = 'boot-fatal';
                d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;' +
                    'font:12px/1.5 monospace;padding:10px 12px;max-height:45%;overflow:auto;white-space:pre-wrap';
                d.textContent = '[启动错误] ' + tag + '\n' + msg;
                (document.body || document.documentElement).appendChild(d);
            } catch (e) {}
        }
        window.__bootFatal = fatal;
        window.addEventListener('error', function (e) {
            fatal('脚本错误', (e && (e.message || (e.error && e.error.message))) || 'unknown');
        });
        window.addEventListener('unhandledrejection', function (e) {
            var r = e && e.reason;
            fatal('异步错误', (r && (r.stack || r.message)) || String(r));
        });
    })();
    </script>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg: #0f0f1e;
            --bg-card: #1a1a2e;
            --bg-card-hover: #222240;
            --bg-elevated: #252545;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --text: #e8e8f0;
            --text-dim: #8888a0;
            --text-muted: #555570;
            --border: #2a2a48;
            --shadow: rgba(0,0,0,0.3);
            --radius: 12px;
            --radius-sm: 8px;
            --player-height: 80px;
            --sidebar-width: 240px;
            --danger: #e74c3c;
            --success: #2ecc71;
            /* 系统栏高度（由原生按真实 insets 注入，网页端为 0） */
            --sbh: 0px;
            --sbn: 0px;
        }

        /* ===== Reset ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        *::-webkit-scrollbar-track { background: transparent; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            font-size: 14px;
            line-height: 1.5;
        }

        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; outline: none; border: none; }
        img { display: block; }

        /* ===== 登录页 ===== */
        #login-view {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg);
            z-index: 1000;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px 36px;
            width: 360px;
            max-width: 90vw;
            box-shadow: 0 20px 60px var(--shadow);
        }
        .login-card h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 32px;
            font-size: 13px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 15px;
            transition: box-shadow .2s;
        }
        .form-group input:focus { box-shadow: 0 0 0 2px var(--accent); }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
            transition: opacity .2s, transform .1s;
        }
        .login-btn:active { transform: scale(.98); }
        .login-btn:disabled { opacity: .5; }
        .login-foot {
            position: fixed; left: 0; right: 0; bottom: calc(8px + var(--sbn));
            text-align: center; font-size: 11px; color: var(--text-muted);
            z-index: 1001; pointer-events: none;
        }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            min-height: 20px;
        }

        /* ===== 主布局 ===== */
        #app { display: none; height: 100%; flex-direction: column; }
        #app.active { display: flex; }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform .3s ease;
        }
        .sidebar-header {
            padding: 20px 20px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .sidebar-header .logo-text {
            font-size: 16px;
            font-weight: 700;
        }
        .nav-menu { flex: 1; padding: 8px 12px; overflow-y: auto; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            text-align: left;
            transition: all .15s;
        }
        .nav-item:hover { background: var(--bg-card-hover); color: var(--text); }
        .nav-item.active { background: var(--bg-elevated); color: var(--accent-light); }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: var(--radius-sm);
        }
        .user-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .user-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .logout-btn {
            margin-left: auto;
            padding: 4px 8px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .logout-btn:hover { color: var(--danger); }

        /* ===== 主内容区 ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            position: sticky;
            top: 0;
            background: rgba(15, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: calc(12px + var(--sbh)) 24px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        .menu-toggle {
            display: none;
            padding: 6px;
        }
        .menu-toggle svg { width: 24px; height: 24px; }
        .bar-back {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--bg-elevated); color: var(--text-dim);
            flex-shrink: 0;
        }
        .bar-back svg { width: 20px; height: 20px; }
        .search-box {
            flex: 1;
            max-width: 480px;
            position: relative;
        }
        .search-box svg {
            position: absolute;
            left: 12px; top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            color: var(--text-muted);
        }
        .search-box input {
            width: 100%;
            padding: 9px 16px 9px 38px;
            background: var(--bg-elevated);
            border-radius: 20px;
            color: var(--text);
            font-size: 13px;
        }
        .search-box input:focus { box-shadow: 0 0 0 2px var(--accent); }

        /* ===== 页面内容 ===== */
        .page-content { padding: 24px; flex: 1; }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 16px;
        }

        /* ===== 专辑网格 ===== */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .album-card {
            cursor: pointer;
            transition: transform .2s;
        }
        .album-card:hover { transform: translateY(-4px); }
        .album-card:hover .album-cover { box-shadow: 0 12px 30px var(--shadow); }
        .album-cover {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius);
            background: var(--bg-elevated);
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
            box-shadow: 0 4px 12px var(--shadow);
            transition: box-shadow .2s;
        }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; }
        .album-cover .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .2s;
        }
        .album-card:hover .play-overlay { opacity: 1; }
        .play-overlay svg { width: 40px; height: 40px; color: #fff; }
        .album-name {
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .album-artist {
            font-size: 12px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 艺术家列表 ===== */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }
        .artist-card {
            text-align: center;
            cursor: pointer;
            transition: transform .2s;
        }
        .artist-card:hover { transform: translateY(-4px); }
        .artist-avatar {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--bg-elevated);
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: 0 4px 12px var(--shadow);
        }
        .artist-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .artist-name {
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 歌曲列表 ===== */
        .song-list-header {
            display: grid;
            grid-template-columns: 30px 44px 1fr 76px 36px;
            gap: 12px;
            padding: 8px 12px;
            color: var(--text-muted);
            font-size: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .song-item {
            display: grid;
            grid-template-columns: 30px 44px 1fr 76px 36px;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            align-items: center;
            transition: background .15s;
        }
        .song-cover {
            width: 44px; height: 44px; border-radius: 9px; overflow: hidden;
            background: var(--bg-elevated); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .song-cover img { width: 100%; height: 100%; object-fit: cover; }
        .song-cover svg { width: 18px; height: 18px; }
        .song-item:hover { background: var(--bg-card-hover); }
        .song-item.playing { background: var(--bg-elevated); }
        .song-item.playing .song-index { color: var(--accent-light); }
        .song-index { font-size: 13px; color: var(--text-muted); text-align: center; }
        .song-play-btn { display: none; align-items: center; justify-content: center; color: var(--text); }
        .song-play-btn svg { width: 16px; height: 16px; }
        .song-info { min-width: 0; }
        .song-title {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .song-item.playing .song-title { color: var(--accent-light); }
        .song-artist {
            font-size: 12px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .song-album {
            font-size: 13px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .song-duration { font-size: 13px; color: var(--text-muted); text-align: right; }
        .song-actions { display: flex; justify-content: flex-end; gap: 4px; }
        .song-action-btn { padding: 4px; color: var(--text-muted); }
        .song-action-btn:hover { color: var(--text); }
        .song-action-btn svg { width: 16px; height: 16px; }

        /* ===== 播放器底栏 ===== */
        .player-bar {
            height: calc(var(--player-height) + var(--sbn));
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px var(--sbn);
            gap: 16px;
            flex-shrink: 0;
        }
        .player-current {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            width: 240px;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .player-cover {
            width: 56px; height: 56px;
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .player-cover img { width: 100%; height: 100%; object-fit: cover; }
        .player-info { min-width: 0; }
        .player-title {
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-artist {
            font-size: 12px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 600px;
        }
        .control-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-btn {
            padding: 6px;
            color: var(--text-dim);
            transition: color .15s;
        }
        .ctrl-btn:hover { color: var(--text); }
        .ctrl-btn.active { color: var(--accent-light); }
        .ctrl-btn svg { width: 18px; height: 18px; }
        .play-btn {
            width: 36px; height: 36px;
            background: var(--text);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg);
        }
        .play-btn:hover { background: var(--accent-light); }
        .play-btn svg { width: 18px; height: 18px; }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .progress-time { font-size: 11px; color: var(--text-muted); min-width: 36px; text-align: center; }
        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 2px;
            width: 0%;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 10px; height: 10px;
            background: var(--accent-light);
            border-radius: 50%;
            opacity: 0;
            transition: opacity .15s;
        }
        .progress-track:hover .progress-fill::after { opacity: 1; }

        .player-right {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 200px;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .volume-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .volume-track {
            width: 80px;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .volume-fill {
            height: 100%;
            background: var(--text);
            border-radius: 2px;
            width: 70%;
        }

        /* ===== 歌单列表 ===== */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .playlist-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all .2s;
            border: 1px solid var(--border);
        }
        .playlist-card:hover { background: var(--bg-card-hover); border-color: var(--accent); }
        .playlist-icon {
            width: 48px; height: 48px;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .playlist-icon svg { width: 24px; height: 24px; color: #fff; }
        .playlist-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .playlist-count { font-size: 12px; color: var(--text-dim); }
        .playlist-actions { display: flex; gap: 8px; margin-top: 12px; }
        .playlist-action-btn {
            padding: 6px 12px;
            background: var(--bg-elevated);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .playlist-action-btn:hover { color: var(--text); }
        .playlist-action-btn.danger:hover { color: var(--danger); }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg { width: 60px; height: 60px; margin-bottom: 16px; opacity: .3; }
        .empty-state h3 { font-size: 16px; margin-bottom: 4px; color: var(--text-dim); }
        .empty-state p { font-size: 13px; }

        /* ===== 加载状态 ===== */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Toast ===== */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: 0 4px 20px var(--shadow);
            opacity: 0;
            transition: opacity .3s, transform .3s;
            z-index: 999;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        /* ===== 专辑详情页 ===== */
        .album-detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            align-items: flex-end;
        }
        .album-detail-cover {
            width: 200px;
            height: 200px;
            border-radius: var(--radius);
            box-shadow: 0 12px 40px var(--shadow);
            flex-shrink: 0;
            overflow: hidden;
            background: var(--bg-elevated);
        }
        .album-detail-cover img { width: 100%; height: 100%; object-fit: cover; }
        .album-detail-info { flex: 1; min-width: 0; }
        .album-detail-type { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .album-detail-name { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .album-detail-meta { color: var(--text-dim); font-size: 14px; }
        .album-play-all {
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--accent-gradient);
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .album-play-all svg { width: 18px; height: 18px; }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            width: 400px;
            max-width: 90vw;
        }
        .modal h3 { font-size: 18px; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 16px; }

        /* ===== 歌词面板 ===== */
        .lyrics-overlay {
            position: fixed;
            inset: 0;
            background: #0d0b12;
            display: flex;
            flex-direction: column;
            z-index: 400;
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
            will-change: transform;
            transition: transform .3s cubic-bezier(.22,.61,.36,1), opacity .22s ease;
        }
        .lyrics-overlay.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

        /* 封面模糊底 */
        .lyrics-backdrop {
            position: absolute;
            inset: -60px;
            background-color: #171320;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(46px) saturate(1.7) brightness(.8);
            transform: scale(1.12);
            pointer-events: none;
        }
        .lyrics-backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,8,14,.5) 0%, rgba(10,8,14,.68) 40%, rgba(10,8,14,.88) 100%);
        }

        .lyrics-panel {
            position: relative;
            z-index: 1;
            background: transparent;
            width: 100%;
            max-width: none;
            height: 100%;
            max-height: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            padding-top: var(--sbh);
            padding-bottom: var(--sbn);
        }
        .lyrics-panel-header {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            padding: 18px 20px 2px 20px;
        }
        /* 下滑退出的拖拽提示条 */
        .lyrics-panel-header::before {
            content: '';
            position: absolute;
            top: 3px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 4px; border-radius: 2px;
            background: rgba(255,255,255,.26);
        }
        .lyrics-head { min-width: 0; }
        .lyrics-more {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.12);
            color: #eaeaf0;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: -2px;
        }
        .lyrics-more svg { width: 20px; height: 20px; }
        .lyrics-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 8px rgba(0,0,0,.45);
        }
        .lyrics-artist {
            margin-top: 3px;
            font-size: 13px;
            color: rgba(255,255,255,.55);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lyrics-close-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: rgba(255,255,255,.6);
            transition: color .15s, background .15s;
        }
        .lyrics-close-btn:active { color: #fff; background: rgba(255,255,255,.1); }

        /* 歌词页底部：进度 + 上一首/播放/下一首 + 随机/循环 */
        .lyrics-footer {
            flex-shrink: 0;
            padding: 8px 20px calc(8px + var(--sbn));
        }
        .lc-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            padding: 2px 0;
            font-size: 11px;
            letter-spacing: .5px;
            color: rgba(255,255,255,.5);
            background: none;
            border: 0;
            cursor: pointer;
            transition: color .15s;
        }
        .lc-label:active { color: #fff; }
        .lc-chip {
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            color: rgba(255,255,255,.75);
        }
        .lc-label-arrow {
            width: 12px;
            height: 12px;
            color: rgba(255,255,255,.35);
        }
        .lc-track {
            position: relative;
            height: 22px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }
        .lc-track::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            transform: translateY(-50%);
            height: 2px;
            border-radius: 1px;
            background: rgba(255,255,255,.22);
        }
        .lc-fill {
            position: relative;
            height: 2px;
            width: 0%;
            border-radius: 1px;
            background: rgba(255,255,255,.92);
        }
        .lc-fill::after {
            content: '';
            position: absolute;
            right: -4px; top: 50%;
            transform: translateY(-50%);
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #fff;
        }
        .lc-times {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,.5);
            font-variant-numeric: tabular-nums;
        }
        .lc-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 8px;
        }
        .lc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            color: rgba(255,255,255,.92);
        }
        .lc-btn:active { color: #fff; }
        .lc-btn svg { width: 22px; height: 22px; }
        .lc-play { width: 52px; height: 52px; }
        .lc-play svg { width: 28px; height: 28px; }
        /* 底部操作条：随机 / 定时 / 频谱 / 队列 / 更多（5 等分，对齐参考布局） */
        .lc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 4px 0;
        }
        .lc-sec-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            height: 44px;
            color: rgba(255,255,255,.5);
            border-radius: 12px;
            transition: color .15s, background .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .lc-sec-btn:active { color: #fff; background: rgba(255,255,255,.08); }
        .lc-sec-btn.active { color: var(--accent, #ff7f76); }
        .lc-sec-btn svg { width: 21px; height: 21px; }
        .lc-sec-badge {
            position: absolute;
            top: 6px;
            right: 50%;
            transform: translateX(20px);
            min-width: 15px;
            padding: 0 3px;
            height: 14px;
            line-height: 14px;
            border-radius: 7px;
            background: var(--accent, #ff7f76);
            color: #1a1a22;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            display: none;
        }
        .lc-sec-badge.on { display: block; }
        /* 频谱可视化画布 */
        .lc-spectrum {
            display: none;
            width: 100%;
            height: 46px;
            margin: 0 0 2px;
            opacity: .95;
        }
        .lyrics-panel-content {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            overflow-y: auto;
            padding: 18px 24px 24px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 82%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 82%, transparent 100%);
        }
        .lyrics-line {
            font-size: var(--ly-size, 17px);
            font-weight: var(--ly-weight, 400);
            line-height: var(--ly-lh, 2.1);
            color: rgba(255,255,255,.55);
            text-align: var(--ly-align, center);
            padding: 1px 0;
            cursor: pointer;
            transition: color .3s, font-size .3s, filter .3s, transform .3s;
            -webkit-user-select: none;
            user-select: none;
        }
        .lyrics-line.ln1 { color: rgba(255,255,255,.38); filter: blur(.4px); }
        .lyrics-line.ln2 { color: rgba(255,255,255,.24); filter: blur(1.5px); }
        .lyrics-line.ln3 { color: rgba(255,255,255,.14); filter: blur(2.6px); }
        .lyrics-line.active {
            color: var(--ly-active-color, #fff);
            font-size: var(--ly-active-size, 22px);
            font-weight: var(--ly-active-weight, 700);
            filter: none;
            transform: scale(1.02);
            text-shadow: 0 2px 16px rgba(0,0,0,.5);
        }
        /* 设置：关闭模糊 */
        .lyrics-panel[data-ly-blur="off"] .lyrics-line.ln1,
        .lyrics-panel[data-ly-blur="off"] .lyrics-line.ln2,
        .lyrics-panel[data-ly-blur="off"] .lyrics-line.ln3 { filter: none; }
        /* 设置：交错效果（奇数句/偶数句左右错开） */
        .lyrics-panel[data-ly-stagger="on"] .lyrics-line:not(.active):nth-child(odd) { transform: translateX(-10px); }
        .lyrics-panel[data-ly-stagger="on"] .lyrics-line:not(.active):nth-child(even) { transform: translateX(10px); }
        .lyrics-plain {
            font-size: 15px;
            line-height: 2;
            color: var(--text-dim);
            white-space: pre-wrap;
            text-align: center;
        }
        .lyrics-empty, .lyrics-loading {
            text-align: center;
            color: rgba(255,255,255,.45);
            padding: 40px 20px;
            font-size: 14px;
        }

        /* ===== 歌词设置（点“词”徽标打开） ===== */
        .lyrics-settings-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s ease;
        }
        .lyrics-settings-overlay.open { opacity: 1; pointer-events: auto; }
        .lyrics-settings {
            width: 100%;
            max-width: 560px;
            max-height: 86vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            background: #16141c;
            border-radius: 20px 20px 0 0;
            padding: 6px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);

            box-shadow: 0 -8px 40px rgba(0,0,0,.45);
        }
        .lyrics-settings-overlay.open .lyrics-settings { transform: translateY(0); }
        /* 歌词来源 → 二级参数面板 */
        .lyrics-settings-overlay.lyrics-adv { z-index: 4; }
        .ls-back {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 50%;
            background: transparent; color: #fff; margin-right: 6px;
        }
        .ls-header-left { display: flex; align-items: center; }
        .ls-source-row { cursor: pointer; }
        .ls-source-row:active { background: rgba(255,255,255,.05); }
        .ls-chevron { display: flex; align-items: center; color: var(--text-dim); }
        .ls-chevron svg { width: 18px; height: 18px; }
        .ls-swatches { display: flex; gap: 10px; align-items: center; }
        .ls-swatch {
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--sw);
            border: 2px solid rgba(255,255,255,.18);
        }
        .ls-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
        .ls-reset {
            width: 100%; padding: 12px 0; border-radius: 12px;
            background: rgba(255,255,255,.08); color: #ddd; font-size: 14px;
        }
        .ls-handle {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,.22);
            margin: 4px auto 12px;
        }
        .ls-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0 14px 4px;
        }
        .ls-header h3 { margin: 0; font-size: 20px; font-weight: 600; color: #fff; }
        .ls-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            color: #fff;
        }
        .ls-close:active { background: rgba(255,255,255,.2); }
        .ls-group {
            background: #221f2b;
            border-radius: 14px;
            padding: 2px 16px;
            margin-bottom: 12px;
        }
        .ls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .ls-row:last-child { border-bottom: 0; }
        .ls-row.ls-row-col { display: block; }
        .ls-row-label { font-size: 15px; color: #ece9f4; }
        .ls-row-note { display: block; margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.4); }
        .ls-value { font-size: 13px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
        .ls-row-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .ls-range {

            margin: 0;
            height: 20px;

        }
        .ls-toggle {

            height: 26px;
            flex-shrink: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.16);
            transition: background .2s;
        }
        .ls-toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform .2s;
        }
        .ls-toggle.on { background: #8ec5ff; }
        .ls-toggle.on::after { transform: translateX(20px); }
        .ls-source-group { padding: 14px 16px 16px; }
        .ls-source-group .ls-row-label { font-size: 12px; color: rgba(255,255,255,.45); }
        .ls-source-value {
            margin-top: 4px;
            font-size: 16px;
            color: #fff;
            letter-spacing: .6px;
        }

        /* ===== 播放列表（底部弹层） ===== */
        .queue-overlay {
            position: fixed;
            inset: 0;
            z-index: 430;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s ease;
        }
        .queue-overlay.open { opacity: 1; pointer-events: auto; }
        .queue-sheet {
            width: 100%;
            max-width: 560px;
            max-height: 72vh;
            display: flex;
            flex-direction: column;
            background: #16141c;
            border-radius: 20px 20px 0 0;
            padding: 6px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .28s cubic-bezier(.22,.61,.36,1);
            box-shadow: 0 -8px 40px rgba(0,0,0,.45);

        @media (max-width: 768px) {
            .lyrics-panel-content { padding: 14px 18px 20px; }
            .lyrics-panel-header { padding: 12px 8px 2px 18px; }
            .lyrics-title { font-size: 19px; }

            .lc-buttons { gap: 26px; margin-top: 6px; }
            .lc-secondary { gap: 24px; }
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 768px) {

                position: fixed;
                left: 0; top: 0; bottom: 0;

        .ss-song-sub { font-size: 13px; color: #96969f; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .ss-group { background: #24242c; border-radius: 16px; overflow: hidden; }
        .ss-row {
            display: flex; align-items: center; gap: 14px;
            width: 100%; padding: 15px 16px; background: none; border: none;
            border-bottom: 1px solid rgba(255,255,255,.07);
            color: #f2f2f5; font-size: 16px; text-align: left;
        }
        .ss-row:last-child { border-bottom: none; }
        .ss-row:active { background: rgba(255,255,255,.05); }
        .ss-ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: #ff7f76; flex-shrink: 0; }
        .ss-ico svg { width: 19px; height: 19px; }
        .ss-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ss-value { font-size: 13px; color: #96969f; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ss-inline-val { color: #96969f; font-size: 13px; }
        .ss-row.danger .ss-ico, .ss-row.danger .ss-label { color: #ff6b61; }

        /* 歌曲信息弹窗 */
        .si-overlay {
            position: fixed; inset: 0; z-index: 475;
            background: rgba(0,0,0,.5);
            display: flex; align-items: center; justify-content: center;
            padding: 22px;
        }
        .si-card {
            width: 100%; max-width: 380px;
            background: #1e1e26; color: #f2f2f5;
            border-radius: 20px; padding: 20px 18px 14px;
        }
        .si-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .si-row { display: flex; gap: 14px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
        .si-row:last-child { border-bottom: none; }
        .si-key { width: 76px; color: #96969f; flex-shrink: 0; }
        .si-val { flex: 1; word-break: break-all; }
        .si-btn {
            width: 100%; margin-top: 14px; padding: 13px;
            border-radius: 14px; background: rgba(255,255,255,.1);
            color: #f2f2f5; font-size: 16px; font-weight: 600;
        }

        @media (max-width: 700px) {
            .home { padding: 0 14px 22px; }
            .home-name { font-size: 38px; }
            .home-feature { gap: 14px; margin: 16px 0 26px; }
            .home-feature-cover { width: 44vw; height: 44vw; max-width: 200px; max-height: 200px; border-radius: 22px; }
            .home-feature-title { font-size: 24px; }
            .home-feature-actions { margin-top: 14px; }
            .home-play-btn { padding: 10px 18px; font-size: 14px; }
            .home-cast-btn { width: 42px; height: 42px; }
            .home-sec-title { font-size: 21px; }
            .lib-art { width: 62px; height: 62px; border-radius: 14px; }
            .lib-name { font-size: 15px; }
            .home-grid { gap: 10px; }
            .lib-card { padding: 12px; gap: 10px; border-radius: 20px; }
        }
    /* ===== 平板 / 车机模式（宽屏横屏） ===== */        .tablet-rail { display: none; }        .tablet-mode #app.active {
            display: grid;            grid-template-columns: 104px minmax(0, 1fr);            grid-template-rows: minmax(0, 1fr) auto;        }        .tablet-mode .tablet-rail {
            display: flex;            flex-direction: column;            grid-column: 1;            grid-row: 1;            gap: 6px;            padding: calc(10px + var(--sbh)) 8px 10px;            background: var(--bg-card);            border-right: 1px solid var(--border);            overflow-y: auto;            -webkit-overflow-scrolling: touch;        }        .tablet-mode .rail-item {
            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;            gap: 5px;            padding: 9px 2px;            border-radius: 14px;            color: var(--text-dim);            font-size: 11px;            font-weight: 600;            letter-spacing: .3px;            transition: background .15s, color .15s;            -webkit-tap-highlight-color: transparent;        }        .tablet-mode .rail-item svg { width: 23px; height: 23px; }        .tablet-mode .rail-item:active { background: rgba(255,255,255,.07); }        .tablet-mode .rail-item.active { background: rgba(255,127,118,.16); color: var(--accent-light); }        .tablet-mode .rail-spacer { flex: 1 1 auto; min-height: 10px; }        .tablet-mode .main-container { grid-column: 2; grid-row: 1; }        .tablet-mode .page-content { width: 100%; max-width: 1360px; margin: 0 auto; padding-left: 34px; padding-right: 34px; }        .tablet-mode .top-bar { padding-left: 34px; padding-right: 34px; }        .tablet-mode .player-bar {
            grid-column: 1 / -1;            grid-row: 2;            --player-height: 92px;            padding-left: 26px;            padding-right: 26px;        }        .tablet-mode .player-cover { width: 58px; height: 58px; }        .tablet-mode .play-btn { width: 58px; height: 58px; }        .tablet-mode .play-btn svg { width: 30px; height: 30px; }        .tablet-mode .ctrl-btn { width: 52px; height: 52px; }        .tablet-mode .ctrl-btn svg { width: 24px; height: 24px; }        .tablet-mode .progress-bar { max-width: 860px; }        .tablet-mode .player-title { font-size: 16px; }        
        /* 首页：居中限宽 */        .tablet-mode .home {
            max-width: 1240px;            margin: 0 auto;            padding-left: 34px;            padding-right: 34px;            padding-top: 78px !important;        }        
        /* 播放页：左信息 / 右歌词 双栏 */        .tablet-mode .lyrics-panel {
            display: grid;            grid-template-columns: minmax(300px, 31%) minmax(0, 1fr);            grid-template-rows: auto 1fr auto;            grid-template-areas: "head lyr" "cover lyr" "foot lyr";            column-gap: 40px;            height: 100%;            padding: var(--sbh) 44px var(--sbn);        }
        .lyrics-cover { display: none; }
        .tablet-mode .lyrics-cover { grid-area: cover; display: block; width: 100%; max-width: 330px; aspect-ratio: 1; object-fit: cover; border-radius: 22px; justify-self: start; align-self: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); margin: 10px 0; }
        .tablet-mode .lyrics-panel-header { grid-area: head; padding: 30px 0 0; justify-content: flex-start; }
        .tablet-mode .lyrics-panel-header::before { top: 6px; width: 54px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.34); }        .tablet-mode .lyrics-panel-content {
            grid-area: lyr;            max-width: none;            padding: 84px 10px 28px;        }        .tablet-mode .lyrics-footer { grid-area: foot; align-self: end; padding: 0 0 16px; }        .tablet-mode .lyrics-title { font-size: 25px; }        .tablet-mode .lyrics-artist { font-size: 15px; margin-top: 4px; }        .tablet-mode .lc-times { font-size: 13px; }        .tablet-mode .lc-btn { width: 56px; height: 56px; }        .tablet-mode .lc-play { width: 68px; height: 68px; }        .tablet-mode .lc-play svg { width: 34px; height: 34px; }        .tablet-mode .lc-buttons { gap: 26px; margin-top: 6px; }        .tablet-mode .lc-track { height: 26px; }        .tablet-mode .lc-actions { margin-top: 2px; }        
        /* 列表行加大，便于车上触控 */        .tablet-mode .song-row { padding-top: 15px; padding-bottom: 15px; }        .tablet-mode .card, .tablet-mode .album-card, .tablet-mode .lib-card { border-radius: 16px; }        
        /* 浅色外壳下的侧栏配色 */        .tablet-mode #app.home-mode .tablet-rail {
            background: #fff;            border-right: 1px solid rgba(0,0,0,.07);        }        .tablet-mode #app.home-mode .rail-item { color: #77777d; }        .tablet-mode #app.home-mode .rail-item.active { background: rgba(226,96,90,.12); color: #e2605a; }        .tablet-mode #app.home-mode.dark-ui .tablet-rail { background: #17171d; border-right-color: rgba(255,255,255,.08); }        .tablet-mode #app.home-mode.dark-ui .rail-item { color: #8d8d97; }        .tablet-mode #app.home-mode.dark-ui .rail-item.active { background: rgba(255,127,118,.16); color: #ff7f76; }    </style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="login-view">
    <div class="login-card">
        <h1>Salt Wave</h1>
        <p class="subtitle">连接你的 Navidrome 音乐服务器</p>
        <form id="login-form" onsubmit="return false;">
            <div class="form-group">
                <label>服务器地址</label>
                <input type="url" id="server-url" placeholder="https://music.example.com" autocomplete="url">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="密码" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn" onclick="if(window.App && App.login && !this.disabled){App.login();}">连接</button>
            <div class="login-error" id="login-error"></div>
        </form>
    </div>
    <div class="login-foot" id="login-foot"></div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">
    <!-- 平板 / 车机模式左侧导航（仅在宽屏横屏时显示） -->
    <div class="tablet-rail" id="tablet-rail">
        <button class="rail-item" data-view="home" onclick="App.navigate('home')" title="首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            <span>首页</span>
        </button>
        <button class="rail-item" data-view="songs" onclick="App.navigate('songs')" title="歌曲">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="7" cy="18" r="2.6"/><circle cx="18" cy="15.5" r="2.6"/><line x1="9.6" y1="18" x2="9.6" y2="6"/><line x1="20.6" y1="15.5" x2="20.6" y2="4"/><path d="M9.6 6 20.6 4"/></svg>
            <span>歌曲</span>
        </button>
        <button class="rail-item" data-view="albums" onclick="App.navigate('albums')" title="专辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/></svg>
            <span>专辑</span>
        </button>
        <button class="rail-item" data-view="artists" onclick="App.navigate('artists')" title="艺人">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.6-4 4.2-6 7.5-6s5.9 2 7.5 6"/></svg>
            <span>艺人</span>
        </button>
        <button class="rail-item" data-view="playlists" onclick="App.navigate('playlists')" title="歌单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/></svg>
            <span>歌单</span>
        </button>
        <button class="rail-item" data-view="starred" onclick="App.navigate('starred')" title="收藏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20s-7-4.5-7-9.4A3.9 3.9 0 0 1 12 7a3.9 3.9 0 0 1 7 3.6C19 15.5 12 20 12 20z"/></svg>
            <span>收藏</span>
        </button>
        <button class="rail-item" data-view="search" onclick="App.navigate('search')" title="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7.4"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
            <span>搜索</span>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-item" data-view="settings" onclick="App.navigate('settings')" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.8 12h2.6M18.6 12h2.6M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
            <span>设置</span>
        </button>
    </div>
<div class="main-container">

        <!-- 内容区 -->
        <div class="content-area">
            <div class="top-bar">
                <button class="bar-back" onclick="App.navBack()" title="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 6 9 12 15 18"/></svg>
                </button>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="搜索歌曲、专辑、艺术家..." oninput="App.handleSearch(event)">
                </div>
            </div>
            <div class="page-content" id="page-content">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 播放器底栏 -->
    <div class="player-bar">
        <div class="player-current">
            <div class="player-cover" id="player-cover" title="点击打开歌词">
                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:20px;">♪</div>
            </div>
            <div class="player-info">
                <div class="player-title" id="player-title">未播放</div>
                <div class="player-artist" id="player-artist"></div>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-buttons">
                <button class="ctrl-btn" id="shuffle-btn" onclick="Player.toggleShuffle()" title="随机播放">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="ctrl-btn" onclick="Player.prev()" title="上一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="play-btn" id="play-btn" onclick="Player.togglePlay()" title="播放/暂停">
                    <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="ctrl-btn" onclick="Player.next()" title="下一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="ctrl-btn" id="repeat-btn" onclick="Player.toggleRepeat()" title="循环模式">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
            <div class="progress-bar">
                <span class="progress-time" id="current-time">0:00</span>
                <div class="progress-track" id="progress-track" onclick="Player.seek(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-time" id="total-time">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <div class="volume-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-dim)"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <div class="volume-track" id="volume-track" onclick="Player.setVolume(event)">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 歌词页（整页滑入，封面模糊背景） -->
<div class="lyrics-overlay" id="lyrics-overlay">
    <div class="lyrics-backdrop" id="lyrics-backdrop"></div>
    <div class="lyrics-panel">
        <div class="lyrics-panel-header">
            <div class="lyrics-head">
                <div class="lyrics-title" id="lyrics-title"></div>
                <div class="lyrics-artist" id="lyrics-artist"></div>
            </div>
        </div>
        <img class="lyrics-cover" id="lyrics-cover" alt="" />
        <div class="lyrics-panel-content" id="lyrics-panel-content">
            <div class="lyrics-empty">点击歌曲开始播放后显示歌词</div>
        </div>
        <div class="lyrics-footer">
            <canvas class="lc-spectrum" id="lc-spectrum"></canvas>
            <button class="lc-label" id="lc-settings-btn" onclick="LyricsStyle.openSettings()" title="歌词设置">
                <span class="lc-chip">词</span><span id="lc-source">EMBEDDED</span>
                <svg class="lc-label-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
            <div class="lc-track" id="lc-track" onclick="Player.seekLyrics(event)">
                <div class="lc-fill" id="lc-fill"></div>
            </div>
            <div class="lc-times">
                <span id="lc-time">0:00</span>
                <span id="lc-total">0:00</span>
            </div>
            <div class="lc-buttons">
                <button class="lc-btn" onclick="Player.prev()" title="上一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="lc-btn lc-play" id="lc-play-btn" onclick="Player.togglePlay()" title="播放/暂停">
                    <svg id="lc-play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="lc-btn" onclick="Player.next()" title="下一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
            <div class="lc-actions">
                <button class="lc-sec-btn" id="lc-shuffle" onclick="Player.toggleShuffle()" title="随机播放">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="lc-sec-btn" id="lc-sleep" onclick="Player.openSleepPicker()" title="睡眠计时器">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><polyline points="9 2 15 2"/></svg>
                    <span class="lc-sec-badge" id="lc-sleep-badge"></span>
                </button>
                <button class="lc-sec-btn" id="lc-spectrum-btn" onclick="Player.toggleSpectrum()" title="频谱可视化">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="16" x2="4" y2="10"/><line x1="8" y1="19" x2="8" y2="7"/><line x1="12" y1="21" x2="12" y2="5"/><line x1="16" y1="19" x2="16" y2="9"/><line x1="20" y1="16" x2="20" y2="12"/></svg>
                </button>
                <button class="lc-sec-btn" id="lc-queue" onclick="QueuePanel.open()" title="播放列表">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>
                </button>
                <button class="lc-sec-btn" id="lc-more" onclick="Player.openSongActions()" title="更多操作">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 歌词设置面板 -->
    <div class="lyrics-settings-overlay" id="lyrics-settings-overlay" onclick="if (event.target === this) LyricsStyle.closeSettings()">
        <div class="lyrics-settings">
            <div class="ls-handle"></div>
            <div class="ls-header">
                <h3>歌词设置</h3>
                <button class="ls-close" onclick="LyricsStyle.closeSettings()" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                </button>
            </div>
            <div class="ls-group">
                <div class="ls-row ls-row-col">
                    <div class="ls-row-head">
                        <span class="ls-row-label">歌词视图字体大小</span>
                        <span class="ls-value" id="ls-size-val">17</span>
                    </div>
                    <input class="ls-range" type="range" id="ls-size" min="12" max="34" step="1" value="17" oninput="LyricsStyle.setSize(this.value)">
                </div>
                <div class="ls-row">
                    <span class="ls-row-label">歌词视图文本居中对齐</span>
                    <button class="ls-toggle on" id="ls-align" onclick="LyricsStyle.toggleAlign()"></button>
                </div>
