name: Build Salt Wave Native APK

on:
  push:
    branches: [main, master]
    paths:
      - 'native/**'
      - '.github/workflows/native-apk.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug + release APK
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Locate build output
        run: find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SaltWave-Native-APK
          path: native/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
